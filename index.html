<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0D">
<title>연극부 살인사건</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 꺼진 극장 — 검은 무대 위 핀 조명 하나. 상단 진행 단계, 본문은 장면, 탐정 노트는 아래에서 올라오는 수첩 */
:root{
  --bg:#0E0C0D; --surface:#1A1618; --raised:#241E21; --ink:#ECE4DC; --muted:#9A8F88; --line:#3A3034;
  --spot:#E8C77A; --spot-ink:#1E1606; --blood:#C2453D; --blue:#7FA6D9; --paper:#EDE3D1; --paper-ink:#2A211A;
  --display:"Nanum Myeongjo",Georgia,serif;
  --body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(232,199,122,.13),transparent 70%),var(--bg);background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,12,13,.94);backdrop-filter:blur(6px);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.step{font-family:var(--mono);font-size:11px;color:var(--spot);letter-spacing:.06em}
.nb-btn{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--spot);background:transparent;color:var(--spot);cursor:pointer;white-space:nowrap}
.nb-btn b{font-family:var(--mono);font-weight:500;margin-left:4px}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--spot)}
.steps i.done{background:#6b5a3a}
main{display:grid;gap:18px;padding-top:20px}
h1{font-family:var(--display);font-size:30px;line-height:1.3;margin:0;text-wrap:balance;font-weight:800}
h2{font-family:var(--display);font-size:21px;line-height:1.35;margin:0;text-wrap:balance;font-weight:800}
h3{font-size:13px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.06em}
p{margin:0;max-width:62ch}
.prose{display:grid;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.quote{border-left:2px solid var(--spot);padding:4px 0 4px 14px;font-family:var(--display);font-size:16px;line-height:1.7}
.title{position:fixed;inset:0;z-index:5;background:#0b0a08;display:flex;justify-content:center;overflow:hidden}
.title img{display:block;height:100%;width:100%;object-fit:contain;object-position:center top}
@media (max-aspect-ratio:3/4){.title img{object-fit:cover}}
.title .tstart{bottom:calc(9% + env(safe-area-inset-bottom,0px))}
.title .tstart{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(240px,58%);font-size:16px;letter-spacing:.3em;background:rgba(20,16,10,.55);color:#e9d8b4;border:1px solid rgba(233,216,180,.55);box-shadow:0 0 24px rgba(233,190,110,.15);backdrop-filter:blur(2px)}
.title .tstart:hover{background:rgba(233,216,180,.12)}
body.ontitle header{display:none}
body.ontitle .nb-btn,body.ontitle #steps{visibility:hidden}
.chat{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.chathead{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chathead b{display:block;font-size:15px}.chathead small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.msgs{display:grid;gap:8px;padding:14px;justify-items:start}
.msg{max-width:84%;background:var(--bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:15px;line-height:1.55;opacity:0;animation:pop .35s ease forwards;animation-delay:var(--d)}
.msg.me{justify-self:end;background:var(--spot);color:#1a140c;border-color:transparent;border-radius:14px 4px 14px 14px}
.msg.file{display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;font:inherit;color:inherit}
.msg.file b{display:block;font-size:14px}.msg.file small{font-size:12px;color:var(--spot)}
.ficon{width:30px;height:36px;flex:none;border-radius:3px;background:linear-gradient(135deg,transparent 8px,var(--spot) 0);position:relative}
.ficon::after{content:"";position:absolute;left:7px;right:7px;top:16px;height:2px;background:#1a140c;box-shadow:0 5px 0 #1a140c,0 10px 0 #1a140c}
.msgs.still .msg:not(.new){animation:none;opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.call{display:flex;gap:10px;align-items:flex-start}
.call .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px;font-family:var(--display)}
.call .who{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:2px}
.casefile{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 16px 4px;display:grid}
.casefile .cfhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--spot);padding:10px 0;border-bottom:1px dashed var(--line)}
.casefile .cfhead:last-child{border-bottom:0;border-top:1px dashed var(--line);margin-top:4px}
.casefile section{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.casefile section:nth-last-of-type(1){border-bottom:0}
.casefile h3{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:0}
.casefile p{margin:0;line-height:1.7;font-size:14.5px}
.casefile ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.6}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.primary{font:inherit;font-weight:700;font-size:15px;padding:14px;border:0;border-radius:12px;background:var(--spot);color:var(--spot-ink);cursor:pointer;width:100%}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{font:inherit;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--raised);border:1px solid var(--line);color:var(--spot)}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.castc{display:grid;justify-items:center;text-align:center;gap:4px;padding:14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.castc b{font-size:15px}
.castc small{font-size:12px;color:var(--muted);line-height:1.4}
button.castc{font:inherit;color:var(--ink);cursor:pointer}
button.castc.sel{border-color:var(--spot);box-shadow:inset 0 0 0 1px var(--spot)}
.says{display:grid;gap:10px}
.say{display:flex;gap:12px;align-items:flex-start}
.say .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;min-width:0}
.say .who{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.say.me{flex-direction:row-reverse}
.say.me .bub{background:var(--spot);color:var(--spot-ink);border-color:transparent;border-radius:14px 4px 14px 14px}
.say.me .who{color:#5a4519}
.budget{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.budget b{font-family:var(--mono);color:var(--spot);font-size:15px;font-weight:500}
.locs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;padding-inline:2px}
.loc{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.loc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.loc .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
.loc .new{font-size:10px;color:var(--blood);margin-left:4px;font-weight:700}
.scene{display:grid;gap:12px}
.scene-desc{color:var(--muted);font-size:14px}
.spots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.spot{font:inherit;font-size:14px;text-align:left;padding:12px 14px;border-radius:10px;border:1px dashed #5a4c50;background:transparent;color:var(--ink);cursor:pointer;line-height:1.45;min-width:0}
.spot:hover:not(:disabled){border-color:var(--spot);border-style:solid}
.spot.seen{border-style:solid;border-color:var(--line);background:var(--surface);color:var(--muted)}
.spot.seen::before{content:"✓ ";color:var(--spot)}
.spot:disabled{cursor:not-allowed;opacity:.45}
.spot.lockspot{border-color:var(--blood);border-style:solid}
.card{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:in .35s ease-out}
.card .cn{font-family:var(--display);font-weight:800;font-size:17px}
.card .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;opacity:.8}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lockbox{display:grid;gap:8px;background:var(--surface);border:1px solid var(--blood);border-radius:12px;padding:14px}
.lockbox .lrow{display:flex;gap:8px}
.lockbox,.lockbox>*,.pop>*{min-width:0}
.lockbox input{flex:1;min-width:0;width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lockbox button{font:inherit;padding:10px 14px;border-radius:8px;border:0;background:var(--blood);color:#fff;cursor:pointer;flex:none}
.err{font-size:13px;color:var(--blood)}
.hint{font-size:13px;color:var(--muted)}
.note-overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.note-overlay[hidden]{display:none}
.note{width:100%;max-width:720px;max-height:88vh;background:var(--paper);color:var(--paper-ink);border-radius:16px 16px 0 0;display:grid;grid-template-rows:auto auto 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.note-head{display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.note-head h2{color:var(--paper-ink)}
.close{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #b9ab94;background:transparent;color:var(--paper-ink);cursor:pointer}
.ntabs{display:flex;gap:4px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #cdbfa7}
.ntab{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:0;background:transparent;color:#6b5d4c;cursor:pointer;white-space:nowrap;flex:none}
.casesum{display:grid;gap:6px}
.casesum h4{font-size:12px;letter-spacing:.08em;color:#8a6d3b;margin:8px 0 0}
.casesum h4:first-child{margin-top:0}
.casesum p,.casesum ul{margin:0;font-size:14px;line-height:1.65}
.casesum ul{padding-left:18px}
.casesum .sub{color:#8a7a62;font-size:13px}
.ntab.on{background:var(--paper-ink);color:var(--paper)}
.nbody{min-height:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.nsec{display:grid;gap:6px}
.nsec h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.foundbar{border:1.5px solid #2c5d9a;color:#2c5d9a;background:#e6eef7;border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px;animation:fin .3s ease}
.foundbar b{display:block;font-size:15px;margin-top:2px}
.ncard.found{border-color:#2c5d9a;box-shadow:0 0 0 2px #2c5d9a}
.foundbar small{display:block;font-weight:400;font-size:12px;margin-top:3px;opacity:.8}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}}
.ncard.hl{animation:hl 1.6s ease}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px #2c5d9a}100%{box-shadow:0 0 0 0 transparent}}
.ncard{border:1px solid #cdbfa7;border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:#f5ecdc}
.ncard p{font-size:14px;line-height:1.6}
.stamp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;border:1.5px solid;transform:rotate(-3deg);display:inline-block}
.stamp.ok{color:#2c5d9a;border-color:#2c5d9a}
.stamp.bad{color:#a5322a;border-color:#a5322a}
.stamp.thin{color:#b07a1e;border-color:#c99a3e}
.stamp.lv-sure{color:#c8473c;border-color:#c8473c;margin-left:6px;vertical-align:2px}
.stamp.lv-amb{color:#9a8a70;border-color:#9a8a70;margin-left:6px;vertical-align:2px}
.lvnote{font-size:12.5px!important;margin:0;padding-left:8px;border-left:2px solid currentColor}
.lvnote.lv-sure{color:#c8473c}.lvnote.lv-amb{color:#9a8a70}
.stamp.none{color:#8b7d6a;border-color:#b9ab94}
.ev{font-size:13px;line-height:1.55;padding-left:14px;position:relative}
.ev::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:50%}
.ev.ok::before{background:#2c5d9a} .ev.bad::before{background:#a5322a} .ev.s::before{background:#6b5d4c}
.ev.bad{text-decoration:none}
.claim{font-size:13px;color:#6b5d4c}
.exc{display:block;font-size:12px;color:#6b5d4c;margin-top:2px}
.claim.struck{text-decoration:line-through;text-decoration-color:#a5322a;text-decoration-thickness:2px}
.dots{font-family:var(--mono);font-size:12px;color:#a5322a;letter-spacing:1px}
.ask{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--paper-ink);background:transparent;color:var(--paper-ink);cursor:pointer;justify-self:start}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid #b9ab94;background:#fff8ec;color:var(--paper-ink);cursor:pointer}
.reply{font-size:14px;background:#fff8ec;border-radius:4px 12px 12px 12px;padding:8px 12px;border:1px solid #cdbfa7}
.reply b{display:block;font-size:12px;color:#6b5d4c;font-weight:500}
.reply.yes{border-color:#2c5d9a}
.nempty{font-size:14px;color:#8b7d6a;padding:12px;border:1px dashed #b9ab94;border-radius:8px;text-align:center}
.locgroup h4{font-size:13px;color:#6b5d4c;font-weight:500}
.hearts{font-family:var(--mono);color:var(--blood);letter-spacing:3px}
.evlist{display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:4px}
.evbtn{font:inherit;font-size:14px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.evbtn.sel{border-color:var(--spot);box-shadow:inset 0 0 0 1px var(--spot)}
.evbtn small{display:block;font-size:12px;color:var(--muted)}
.ending{display:grid;gap:14px;padding:22px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ending.true{border-color:var(--spot);box-shadow:0 0 60px rgba(232,199,122,.12)}
.ending.bad{border-color:var(--blood)}
.line{font-family:var(--display);font-size:18px;line-height:1.7;text-align:center;text-wrap:balance;color:var(--spot);padding:10px 0}
.truth .tr strong{display:block;font-weight:600;margin-bottom:3px}
.truthbtns{margin-top:8px}
.evbtn .evd{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;font-weight:400}
.ncard.fold{padding:0}
details.fold summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"＋";color:var(--muted);font-weight:400}
details.fold[open] summary::after{content:"－"}
details.fold .fb{padding:0 12px 12px}
.truthpage{display:grid;gap:22px}
.truthpage h1{font-family:"Nanum Myeongjo",serif;font-size:34px;letter-spacing:-.5px}
.truthpage .line,.truthpage .retort{white-space:nowrap;font-size:clamp(10px,calc((100vw - 48px)/26),17px)!important}
.truthpage .retort{margin:0;text-align:center;font-family:var(--display);line-height:1.8;color:var(--ink)}
.truthpage .retort b{color:#c8473c;font-weight:700}
.truthpage .retort span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.1em}
.truthpage section{display:grid;gap:12px}
.truthpage .truth>.eyebrow{display:none}
.truthpage h3{font-size:13px;letter-spacing:.12em;color:var(--spot);font-weight:600}
.truth{display:grid;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.truth .tr{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.truth .tr b{font-family:var(--mono);font-size:12px;color:var(--spot);font-weight:500}
.truth .tr p{font-size:14px;line-height:1.65}
.truth .tr small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.flash{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line)}
@media (max-width:440px){.cast{grid-template-columns:repeat(3,1fr);gap:6px}.castc{padding:12px 4px}.spots{grid-template-columns:1fr}h1{font-size:26px}.brand{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.results{display:grid;gap:10px}
.pop-ov{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pop{width:100%;max-width:560px;max-height:86vh;overflow:auto;display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:in .25s ease-out}
.pop-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pop-close{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:none}
.patpad{width:100%;max-width:240px;aspect-ratio:1;justify-self:center;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg);border-radius:12px;border:1px solid var(--line)}
.patpad circle.dot{fill:var(--muted)} .patpad circle.dot.on{fill:var(--spot)}
.patpad circle.ring{fill:none;stroke:var(--line);stroke-width:2}
.patpad polyline{fill:none;stroke:var(--spot);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.back{font:inherit;font-size:13px;justify-self:start;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.spot.into{border-style:solid;border-color:#6b5a3a}
.did{font-size:13px;color:var(--spot);font-weight:500}
.qa{display:grid;gap:6px}

 {id:"st_phone",n:"꺼진 휴대폰",t:"배터리 0%. 충전해야 볼 수 있다. 증거물로 맡겨 두었다."},
 {id:"st_shoe",to:"wonjin",why:"극장을 잘 아는 연출 함원진",n:"시멘트 가루",t:"진혁의 신발 밑창에 회색 시멘트 가루가 묻어 있다. 무대는 나무 바닥이다.",
  q:"이 극장에 시멘트 바닥인 곳이 있습니까?",ans:{wonjin:"무대 밑 지하요. 선배 작업실이었어요. 거기 가면 늘 있었죠.",allen:"지하입니다. 관도 거기서 칠했습니다.",jeongmo:"창고 아닐까요? 그러고 보니 그날 태영이가 창고 쪽으로 가는 걸 본 것 같아요. 네 시 좀 넘어서요."}},
 {id:"st_lid",nn:"지문",n:"물감 지문",t:"관 뚜껑 안쪽, 덜 마른 검은 물감에 지문이 찍혀 있다.",
  q:"관 뚜껑 안쪽의 지문. 누구의 것입니까?",u:{o:"allen",r:1,y:"네, 제 지문입니다. 관은 제가 칠했습니다. 그게 제 일입니다."},ans:{jeongmo:"관은 소품이잖아요. 앨런 선배가 만들었어요. 소품에 지문 있는 게 이상한 건가요?",wonjin:"관은 소품이잖아요. 앨런 선배가 만들고 칠했어요. 지문이면 앨런 선배 거겠죠.",minhee:"그거 소품이에요. 앨런 선배 작품이고요.",taeyoung:"소품에 지문 있는 게 뭐 이상해요? 앨런 선배가 만든 소품인데.",sungmin:"소품이에요. 앨런 선배가 만들었어요."}},
 {id:"st_seam",to:"wonjin",why:"무대 장치를 아는 연출 함원진",rb:{p:"allen",t:"리프트입니다. 관 밑판을 거기에 맞춰 만들었습니다."},n:"네모난 이음새",t:"관 바로 밑 무대 바닥에 네모난 이음새가 있다. 관이 그 위에 딱 맞게 놓여 있다.",
  q:"관 아래 바닥의 이음새. 무슨 장치입니까?",ans:{wonjin:"리프트 판이에요. 마지막 장면에 관이 무대 밑에서 쑥 올라와요. 제 자랑거리죠.",jeongmo:"무대 장치요. 자세히는 저도 잘 몰라요.",allen:"리프트입니다. 관 밑판을 거기에 맞춰 만들었습니다."}},
 {id:"st_nodrag",n:"끌린 자국 없음",t:"시신을 끌고 온 자국이 어디에도 없다. 진혁은 어떻게 무대 한가운데까지 왔을까?"},
 {id:"st_guard",n:"경비의 증언",t:"“여섯 시 순찰 땐 무대가 깜깜해서 관은 못 봤어요. 아홉 시 반엔 조명 하나가 딱 관만 비추고 있더라고.”"},
 {id:"st_petechia",n:"붉은 점",t:"분장 아래 눈꺼풀과 뺨에 붉은 점들. 질식의 흔적이다. 분장은 이걸 가리려는 것이었다."},
 {id:"st_tox",to:"woobin",why:"피해자와 함께 사는 서우빈",nl:1,n:"수면제 성분",t:"부검 결과, 혈액에서 수면제 성분 검출. 진혁은 잠든 채 살해됐다.",
  q:"피해자가 평소 수면제를 복용했습니까?",ans:{woobin:"아뇨, 절대요. 걔는 눕자마자 코 골아요. 약 먹는 거 한 번도 못 봤어요.",minhee:"형은 약 안 먹어요. 감기약도요.",jeongmo:"진혁이 요즘 잠을 못 잔다고 했어요. 약 먹는 것 같던데요. 작가들은 다 그렇잖아요."}},
 {id:"st_nail",nl:1,n:"손톱 밑 피부 조직",t:"부검 결과, 오른손 손톱 밑에서 다른 사람의 피부 조직이 나왔다. 범인의 몸 어딘가에 긁힌 상처가 있다.",
  q:"피해자 손톱 밑의 피부 조직. 누구의 것이라고 생각합니까?",u:{o:"jeongmo",r:3},ans:{serim:"저는 아니에요. 보세요, 긁힌 데 하나 없잖아요.",allen:"제가 아닙니다. 손가락에 베인 상처는 있습니다. 관 뚜껑을 다듬다 커터칼에 베였습니다. 긁힌 상처는 아닙니다.",woobin:"손등에 긁힌 데는 있어요. 진혁이 서랍 뒤지다가 서랍 모서리에 긁혔어요. 손톱자국이랑은 다르잖아요. 딱 잘라 말할게요.",wonjin:"저 아니에요. 소매라도 걷어 드릴까요?",minhee:"저 아니에요. 무릎에 멍은 있어요. 술집 계단에서 넘어졌거든요. 긁힌 데는 없고요.",hyungjun:"저는 아니에요. 상처 같은 건 없어요.",taeyoung:"손등이요? 긁힌 거 맞아요. 짐 싸다가 박스 모서리에 긁혔어요. 손톱자국이랑은 다르잖아요.",sungmin:"저 아니에요. 다친 데 없어요.",jeongmo:"저도 다치긴 했어요. 근데 그건 소품 철사에 긁힌 거예요."}},
 {id:"st_sched",to:"woobin",why:"문자를 받은 서우빈",nl:1,n:"예약 전송 기록",t:"우빈에게 간 17:55 문자는 17:20에 ‘예약 전송’으로 걸어 둔 것이었다. 17:55에 진혁이 살아 있었다는 증거는 사라졌다.",
  q:"다섯 시 오십오 분의 문자. 강진혁 씨가 직접 보낸 것이 맞습니까?",ans:{woobin:["네, 걔 문자였어요. 확실해요.","…지금 보니까 이상해요. 걔는 마침표를 안 찍거든요. 그건 확실해요."],jeongmo:"예약 전송이요? 진혁이 원래 그거 자주 썼어요. 단톡 공지도 늘 예약으로 걸어 두고요. 본인이 걸어 둔 거 아닐까요?"}},
 {id:"st_kakaolist",toAlt:{attr:["bs_kakao","minhee"],to:"minhee",why:"‘쓰레기’로 저장된 강민희",q:"‘쓰레기’로 저장된 번호의 부재중 전화. 이것도 본인입니까?"},nl:1,n:"‘쓰레기’의 부재중 전화",t:"진혁의 통화 기록. 15:45, ‘쓰레기’로 저장된 번호에서 부재중 전화 1통. 진혁은 받지 않았다.",
  q:"피해자가 ‘쓰레기’로 저장한 사람은 누구입니까?",cond:[{who:"minhee",attr:["bs_kakao","minhee"],r:2,own:1,t:"연락처도 그렇게 저장했어요? …전부 다 그렇게 저장해 놨나 보네요. 네, 그 전화도 제가 건 거예요."}],u:{o:"minhee",r:2,y:"쓰레기는 저일 거예요. 그때쯤 제가 형한테 전화를 걸었거든요. 형은 저를 그렇게 저장했더라고요. 남들 앞에선 동생이라고 한 번도 안 불렀으면서. 웃기죠.",e:"쓰레기요? 글쎄요. 형한테 미움받던 사람이야 많았겠죠."},ans:{jeongmo:"쓰레기요? 와… 진혁이가 사람을 그렇게 저장했어요? 저는 모르겠어요.",wonjin:"선배가 사람을 그렇게 저장했다고요? …짐작 가는 사람은 있는데, 이건 농담으로 말할 게 아니라서요.",taeyoung:"쓰레기요? 저인 줄 알았는데요. 근데 선배랑 카톡 할 사이는 아니었거든요.",sungmin:"저 아니에요. 그 선배랑 카톡 안 해요.",hyungjun:"…그건 제가 모르는 일이에요.",woobin:"와, 걔 진짜… 동생이 있다는 얘기는 들었는데, 설마 동생을 그렇게 저장했겠어요?",allen:"저는 모릅니다.",serim:"진혁이가 사람을 그렇게 저장했다니… 동생이 있다는 얘긴 들었는데, 누군지는 몰라요."}},
 // 상수
 {id:"up_panel",n:"잠긴 조작반",t:"열쇠로 잠긴 무대 리프트 조작반."},
 {id:"up_switch",to:"wonjin",why:"무대 큐를 관리하는 연출 함원진",rb:{p:"taeyoung",t:["리프트요? 저한텐 묻지도 마세요. 아무도 저한텐 안 알려 주니까.",{t:"…네 시 오십 분쯤이요. 창고에 있었는데 올라가는 소리 들었어요. 이제야 물어보시네.",g:"tk_taeyoung"}]},n:"‘상승’ 위치",t:"스위치가 ‘상승’에 그대로 있다. 마지막으로 누군가 리프트를 올렸다.",
  q:"리프트를 마지막으로 올린 사람은 누구입니까?",ans:{jeongmo:"연습 땐 제가 올려요. 부활 장면이라서요. 근데 그날은 연습이 없었잖아요.",allen:"관을 실어 둔 건 저입니다. 올린 건 제가 아닙니다.",taeyoung:["제가 그걸 어떻게 알아요.",{t:"…네 시 오십 분쯤이요. 창고에서 올라가는 소리 들었어요. 이제야 물어보시네.",g:"tk_taeyoung"}],wonjin:"열쇠는 주연이 관리해요. 부활 장면 연습 때문에요. 이건 중요한 거죠?"}},
 {id:"up_hand",nn:"손자국",n:"반쪽 손자국",t:"조작반 위 먼지에 손바닥 반쪽 자국이 남아 있다.",
  q:"조작반 위의 손자국. 누구의 것입니까?",u:{o:"jeongmo",r:3},ans:{allen:"조작반은 관을 실을 때 저도 만집니다. 그래도 그 손자국은 제 것이 아닙니다.",wonjin:"리프트는 주연이 주로 만져요. 저는 큐만 주고요.",minhee:"배우니까 대충은 알죠. 리프트는 정모 선배 담당이에요. 관심은 없고요.",taeyoung:"행인 3이 리프트 만질 일이 있겠어요?",sungmin:"분장팀이라 리프트 같은 건 잘 몰라요.",jeongmo:"제 손자국 아니에요. 그 전날 원진이랑 태영이가 리프트 테스트한다고 한참 만졌어요."}},
 {id:"up_cue",n:"「관」 큐시트",t:"“Q47 리프트 상승. 주인공, 관에서 기상.”"},
 {id:"up_sched",n:"취소된 연습",t:"오늘 15~17시 연습에 줄이 그어져 있다. ‘취소 — 진혁’."},
 {id:"up_band",nn:"반창고",n:"반창고 포장지",t:"커튼 뒤 바닥에 큰 사이즈 반창고 포장지. 범인이 사용했을까?",
  q:"이 반창고를 사용한 사람은 누구입니까?",u:{o:"jeongmo",r:3},ans:{wonjin:"무대에선 다들 자주 다쳐요. 누구 건지는 모르겠네요.",minhee:"멍에 반창고 붙이는 사람 있어요? 전 아니에요.",taeyoung:"제 손등은 그냥 뒀어요. 반창고 붙일 정도는 아니라서요.",allen:"제가 쓴 반창고가 아닙니다. 제 손가락엔 작은 밴드를 붙였습니다. 이렇게 큰 건 필요 없습니다.",jeongmo:"반창고는 누구나 쓰잖아요.",sungmin:["몰라요.","분장실 구급함에 있던 반창고랑 같은 제품이에요."]}},
 {id:"up_exit",n:"걸린 걸쇠",t:"비상구가 안쪽에서 걸쇠로 잠겨 있다. 밖에서 들어온 사람의 짓은 아니다."},
 {id:"up_flyer",to:"serim",n:"「겨울 정류장」 전단지",t:"의자 위에 대학로 공연 전단지. 작·연출 박세림.",s:"serim",
  q:"이 전단지, 본인이 두고 간 것이 맞습니까?",ans:{serim:"제가 두고 나왔어요. 진혁이가 한 번은 봤으면 해서요. 제가 쓰고 제가 만든 작품이라는 걸."}},
 {id:"up_hair",nn:"머리끈",n:"파란색 머리끈",t:"상수 바닥, 계단 앞에 파란색 머리끈 하나.",
  q:"이 머리끈은 누구의 것입니까?",u:{o:"minhee",r:2,y:"제 머리끈이에요. 네, 갔었어요. 극장에.",e:"글쎄요. 머리끈이야 누구나 쓰죠."},ans:{jeongmo:"머리끈이요? 민희가 그런 색 자주 하던데요. 그날 극장 앞에서 민희 본 것 같기도 하고요.",wonjin:"파란색이면… 민희가 하고 다니던 머리끈 같은데요. 확실하진 않아요.",taeyoung:"저 머리 짧은 거 안 보여요?",sungmin:"제 머리끈 아니에요. 민희 선배 머리끈 같기도 하고요.",allen:"저는 머리끈을 쓰지 않습니다.",hyungjun:"…민희 머리끈 같긴 해요. 그래도 민희는 그날 저랑 있었어요."}},
 {id:"up_stairs",n:"잠긴 지하 문",t:"지하로 내려가는 문이 잠겨 있다. 경비 말로는 마스터키가 밤에는 시설팀 금고에 들어가 있어, 내일 아침에야 열 수 있다고 한다."},
 {id:"up_memo",n:"열쇠 보관 메모",t:"“리프트·지하 열쇠: 무대감독 1, 배우 연습용 1 (연습실 열쇠함).”"},
 {id:"up_sm",n:"무대감독의 답장",t:"“저 어제 본가 내려와 있었어요. 제 열쇠도 같이요.” 극장에 남은 열쇠는 연습실 열쇠함의 하나뿐이다."},
 // 하수
 {id:"dn_bag",n:"그대로인 지갑",t:"지갑과 학생증이 그대로 있다. 강도는 아니다."},
 {id:"dn_tumbler",to:"wonjin",why:"피해자와 가장 가까웠던 함원진",nl:1,n:"말라 있는 텀블러",t:"비어 있고 바짝 말라 있다. 진혁은 그날 자기 음료를 마시지 않았다.",
  q:"피해자는 평소 무엇을 마셨습니까?",ans:{wonjin:"선배는 텀블러에 보리차만 마셨어요. 할아버지처럼. 남이 사 준 건 잘 안 마셨는데.",minhee:"형은 커피 잘 안 마셔요. 누가 사 주면 모를까.",jeongmo:"커피도 마셨어요. 제가 가끔 사다 줬거든요."}},
 {id:"dn_script",to:"wonjin",why:"최종고를 받기로 했던 연출 함원진",n:"찢긴 마지막 독백",t:"가방 속 「관」 최종 대본 출력본. 부원들이 받은 대본과 같지만, 맨 뒤 마지막 독백 두 쪽만 찢겨 나갔다.",
  q:"대본의 마지막 독백. 누가 찢었습니까?",ans:{jeongmo:"독백이요? 대본은 저도 다 받았는데, 마지막 독백은 진혁이가 아직 안 줬어요. 주연인 저도 못 봤다니까요.",wonjin:"앞부분은 다 받았어요. 마지막 독백만 월요일에 최종고로 받기로 했고요. 연출인 저도 그 독백은 몰라요. 웃기죠?",sungmin:"몰라요."}},
 {id:"dn_cast",to:"minhee",rb:{p:"wonjin",t:"선배가 고집했어요. 저는 끝까지 반대했고요. 그건 진짜 아니었어요."},nl:1,n:"배역표",t:"주연 구정모. 혼외자 역 강민희. 행인 3 김태영(대사 1줄).",s:"minhee",
  q:"혼외자 역을 강민희 씨가 맡은 이유는 무엇입니까?",ans:{minhee:"형이 줬어요. 아빠가 보러 오는 공연에서. 센스 있죠.",wonjin:"선배가 고집했어요. 저는 끝까지 반대했고요. 그건 진짜 아니었어요."}},
 {id:"dn_cast2",to:"taeyoung",rb:{p:"wonjin",t:"제가 반대했어요. 태영이, 말은 저래도 제일 열심히 하는 애예요."},nl:1,n:"“태영 — 빼자”",t:"배역표 여백에 진혁의 글씨로 ‘태영 — 빼자’.",s:"taeyoung",
  q:"‘태영 — 빼자’. 이 메모를 알고 있었습니까?",ans:{taeyoung:"알죠. 처음부터 저 싫어했어요. 이유요? 그런 게 있었겠어요?",wonjin:"제가 반대했어요. 태영이, 말은 저래도 제일 열심히 하는 애예요."}},
 {id:"dn_foot",nn:"발자국",n:"검은 물감 발자국",t:"반쯤 마른 검은 물감 발자국이 지하 계단 쪽에서 나와 하수 출구로 이어진다.",
  q:"이 물감 발자국은 누구의 것입니까?",u:{o:"allen",r:2,y:"…제 신발이 맞습니다. 그날 지하에서 관을 칠하고 이쪽으로 나왔습니다. 도서관에 계속 있었다는 건 거짓말입니다. 죄송합니다.",e:"관을 칠하다가 묻었나 봅니다. 언제 묻었는지는 모르겠습니다. 그런데 그날은 도서관에 있었습니다."},ans:{jeongmo:"음, 물감이면 소품팀 아닐까요? 앨런 선배가 관 칠했잖아요.",wonjin:"검은 물감이면 관 칠한 사람이죠. 앨런 선배요.",minhee:"물감이면 소품팀이겠죠.",taeyoung:"물감 밟을 일 있는 사람이 몇이나 된다고요. 소품팀이겠죠.",sungmin:"분장팀은 검은 물감 안 써요. 소품팀이겠죠."}},
 {id:"dn_check",n:"베개 체크",t:"‘관 속 베개(보라) 1개’가 어제 날짜로 체크돼 있다. 어제까진 관 속에 있었다."},
 {id:"dn_carrier",n:"2구 컵 캐리어",t:"하수 휴지통에 학교 앞 카페의 2구 컵 캐리어. 누군가 커피를 두 잔 사 왔다.",
  q:"이 컵 캐리어. 커피를 사 온 사람은 누구입니까?",u:{o:"jeongmo",r:2,y:"네. 제가 사 왔어요. 진혁이가 사다 달라고 해서요. 한 잔 주고 바로 나왔어요.",e:"커피는 다들 사 마시잖아요."},ans:{wonjin:"저는 카페에서 마시고 왔어요. 들고 오진 않았고요.",minhee:"저 아니에요. 형준이랑 카페에 있었어요.",taeyoung:"커피 두 잔이요? 같이 마실 사람도 없어요, 저는.",sungmin:"저 커피 안 마셔요.",allen:"그때 커피를 마셨는지 기억이 안 납니다."}},
 {id:"dn_photo",n:"X 표시된 사진",t:"거울 옆 단체사진. 진혁의 얼굴에만 펜으로 X가 그어져 있다.",
  q:"사진에 X 표시를 한 사람은 누구입니까?",u:{o:"taeyoung",r:2,y:"제가 그었어요. 그 선배가 절 싫어하는데, 그 정도면 저도 그 선배를 싫어할 이유가 충분히 되지 않아요?",e:"제가요? 제가 그었으면 아예 사진에서 오려 냈겠죠."},ans:{wonjin:"제가 그었으면 이름까지 써 놨겠죠. 농담이고요, 저 아니에요.",jeongmo:"에이, 저 아니에요. 전 진혁이에게 크게 관심 없어요. 그래서 미워할 이유도 없고요.",minhee:"저 아니에요. 제가 그었으면 형 보는 앞에서 대놓고 그었겠죠.",sungmin:"저 아니에요. 제가 그렸으면 더 크게 그었겠죠.",allen:"제가 아닙니다. 제가 그었다면 선이 그렇게 삐뚤지 않았을 겁니다.",woobin:"저 아니에요. 제가 그었으면 사진째 찢어 버렸겠죠. 딱 잘라 말할게요.",serim:"저는 아니에요. 제가 화가 났다면 사진이 아니라 그 애한테 직접 말했을 거예요.",hyungjun:"저는 아니에요. 제가 화를 냈다면 사진이 아니라 공모전 주최 측에 연락했겠죠."}},
 {id:"dn_order",n:"관 제작 발주서",t:"디자인·제작·도색: 마앨런(소품팀).",s:"allen"},
 {id:"dn_poster",to:"allen",rb:{p:"wonjin",t:"앨런 선배 작품이에요. 다들 알면서 모른 척했죠. 저 포함해서요."},nl:1,n:"덮어쓴 디자이너 이름",t:"포스터 시안 3장. 디자이너 이름이 모두 ‘강진혁’으로 덮어써져 있다. 원래 이름은 마앨런.",s:"allen",
  q:"디자이너 이름이 왜 강진혁으로 되어 있습니까?",ans:{allen:"원래는 제가 만들었습니다. 이름만 바뀌었습니다. 그 사람은 ‘극이 없으면 너도 필요 없다’고 했습니다.",wonjin:"앨런 선배 작품이에요. 다들 알면서 모른 척했죠. 저 포함해서요."}},
 // 지하
 {id:"bs_desk",n:"켜진 채 방전된 스탠드",t:"진혁은 여기서 일하다 사라졌다. 의자가 뒤로 밀려 있다."},
 {id:"bs_cup",to:"wonjin",why:"피해자와 가장 가까웠던 함원진",rb:{p:"jeongmo",t:"그건 제가 사다 준 커피예요. 진혁이가 부탁해서요. 근데 약이요? 그건 진짜 몰라요."},n:"침전물이 남은 컵",t:"얼음이 다 녹은 아메리카노. 바닥에 하얀 침전물. 감식 결과 수면제.",
  q:"이 커피를 피해자에게 건넨 사람은 누구입니까?",ans:{wonjin:"선배는 남이 사 준 커피 잘 안 마셨어요. 마셨다면… 꽤 가까운 사람이 줬겠죠.",jeongmo:"그건 제가 사다 준 커피예요. 진혁이가 부탁해서요. 근데 약이요? 그건 진짜 몰라요.",allen:"제가 있을 때는 커피가 없었습니다. 보리차를 마셨습니다."}},
 {id:"bs_sticker",n:"주문 스티커",t:"“15:02 아이스아메리카노 2/2”. 두 잔 중 하나다."},
 {id:"bs_kakao",toAlt:{attr:["st_kakaolist","minhee"],to:"minhee",why:"‘쓰레기’로 저장된 강민희",q:"‘쓰레기’가 보낸 카톡. 이것도 본인입니까?"},nl:1,n:"읽지 않은 카톡",t:"진혁의 카톡. 15:42 ‘쓰레기’: “형 자? 깨면 연락해. 아빠 얘기야.” 읽지 않음 1.",
  q:"‘쓰레기’로 저장된 사람이 보낸 이 메시지. 발신자는 누구입니까?",cond:[{who:"minhee",attr:["st_kakaolist","minhee"],r:2,own:1,t:"카톡에도요? …전부 다 그렇게 저장해 놨나 보네요. 네, 그 카톡도 제가 보낸 거예요."}],u:{o:"minhee",r:1,y:"쓰레기는 저일 거예요. 그때쯤 제가 형한테 카톡을 보냈거든요. 형은 저를 그렇게 저장했더라고요. 남들 앞에선 동생이라고 한 번도 안 불렀으면서. 웃기죠."},ans:{jeongmo:"쓰레기요? 와… 진혁이가 사람을 그렇게 저장했어요? 저는 모르겠어요.",wonjin:"선배가 사람을 그렇게 저장했다고요? …짐작 가는 사람은 있는데, 이건 농담으로 말할 게 아니라서요.",taeyoung:"쓰레기요? 저인 줄 알았는데요. 근데 선배랑 카톡 할 사이는 아니었거든요.",sungmin:"저 아니에요. 그 선배랑 카톡 안 해요.",hyungjun:"…그건 제가 모르는 일이에요.",woobin:"와, 걔 진짜… 동생이 있다는 얘기는 들었는데, 설마 동생을 그렇게 저장했겠어요?",allen:"저는 모릅니다.",serim:"진혁이가 사람을 그렇게 저장했다니… 동생이 있다는 얘긴 들었는데, 누군지는 몰라요."}},
 {id:"bs_log",n:"마지막 입력 15:32",t:"15:32 이후 키보드 입력이 없다. 15시 반쯤 잠들었다."},
 {id:"bs_note",n:"「관」 마지막 대사",t:"“사랑하는 사람을 세상에 숨겨야 한다는 건 죽음과 다름없다. 사랑이 없는 삶은 죽음이다.”"},
 {id:"bs_note2",to:"wonjin",why:"피해자의 메모 습관을 아는 함원진",rb:{p:"jeongmo",t:"네. 저 맞아요. 커피만 주고 나왔어요. 근데 마지막 독백은 안 봤어요…. 진혁이가 미리 써 둔 메모인가 봐요."},nl:1,n:"“15:15 J 옴”",t:"수첩 마지막 장. “15:15 J 옴. 마지막 독백 보여줌. 그 표정, 쓸 수 있겠다.”",s:"jeongmo",
  q:"‘15:15 J 옴’. 여기서 J는 누구를 가리킵니까?",ans:{jeongmo:"네. 저 맞아요. 커피만 주고 나왔어요. 근데 마지막 독백은 안 봤어요…. 진혁이가 미리 써 둔 메모인가 봐요.",wonjin:"선배는 사람을 이니셜로 적어요. J면… 정모 형, 아니면 진혁 선배 본인. 둘 중 하나죠."}},
 {id:"bs_fiber",n:"보라색 벨벳 섬유",t:"시멘트 바닥에 사라진 관 베개와 같은 천의 섬유."},
 {id:"bs_drag",n:"끌린 자국",t:"책상에서 리프트까지 무언가를 끈 자국."},
 {id:"bs_pillow",to:"allen",why:"베개를 만든 소품팀 마앨런",n:"숨겨진 베개",t:"상자 뒤에 숨긴 보라색 베개. 진혁의 침과 무색 립밤 자국. 흉기다.",
  q:"관 속 베개가 지하에서 발견됐습니다. 설명할 수 있습니까?",ans:{allen:"제가 만든 베개입니다. 분명 관 속에 넣어 두었습니다. 소품 확인 목록에도 표시해 두었습니다.",jeongmo:"그 베개, 앨런 선배가 들고 다니던 거예요. 창고에 둔다고 했는데, 왜 거기 있지?"}},
 {id:"bs_lift",n:"빈 리프트 자리",t:"리프트 판이 올라가 있고 관 받침대 자리만 남았다. 관은 원래 여기 있었다."},
 {id:"bs_tape",nn:"테이프",to:"allen",why:"관을 칠한 소품팀 마앨런",n:"마스킹테이프와 물감",t:"‘앨런’이라고 적힌 마스킹테이프와 검은 물감 자국.",s:"allen",
  q:"이 마스킹테이프, 본인의 것이 맞습니까?",ans:{allen:["제 테이프입니다. 오전에 썼습니다.","제 테이프입니다. 한 시부터 두 시 오십 분까지 여기서 관을 칠했습니다."]}},
 // 분장실
 {id:"mk_kit",n:"AS 분장 키트",t:"안성민 이니셜이 새겨진 분장 키트.",s:"sungmin"},
 {id:"mk_found",nn:"파운데이션",to:"sungmin",why:"분장팀 안성민",n:"같은 색 파운데이션",t:"시신 얼굴의 분장과 같은 색이다.",s:"sungmin",
  q:"이 파운데이션, 본인의 것이 맞습니까?",ans:{sungmin:"제 파운데이션이에요. 근데 선배 얼굴에 바른 건 제가 아니에요."}},
 {id:"mk_conc",to:"sungmin",why:"분장팀 안성민",rb:{p:"jeongmo",t:["컨실러는 분장실에 있으니까 누구나 쓸 수 있잖아요.","아… 그 컨실러, 제가 좀 빌렸어요. 팔 긁힌 상처 가리려고요. 성민이는 상관없어요."]},n:"줄어든 컨실러",t:"컨실러 21호. 어제 새것이었는데 3분의 1이 사라졌다. 한 번에, 많이 썼다.",
  q:"이 컨실러는 왜 사용했습니까?",ans:{sungmin:["저는 안 썼어요. 어제 새로 샀는데 줄어 있었어요.",{t:"저는 안 썼어요. 다섯 시에 정모 형이 빌려 갔어요. …형 팔 다쳤대서, 그냥 줬어요.",g:"tk_sungmin"}],jeongmo:["컨실러요? 제가 그걸 왜 써요?","팔 긁힌 상처 가리려고 좀 빌렸어요. 그게 다예요, 진짜로."]}},
 {id:"mk_memo",to:"sungmin",rb:{p:"wonjin",t:"선배 술자리는 다들 피했어요. 성민이만 그런 거 아니에요."},nl:1,n:"“선배랑 술 X”",t:"거울에 성민의 메모가 여러 장. ‘선배랑 술 X’.",s:"sungmin",
  q:"‘선배랑 술 X’. 무슨 의미입니까?",ans:{sungmin:"말하기 싫어요. 그냥 싫어서요.",jeongmo:"그 메모는 저도 처음 봐요."}},
 {id:"mk_band",to:"sungmin",why:"분장실을 쓰는 안성민",rb:{p:"jeongmo",t:["반창고는 누구나 쓰잖아요.","네. 제가 붙였어요. 팔에요. 그게 다예요."]},n:"빈 반창고 칸",t:"구급함에서 큰 사이즈 반창고 한 장이 비었다.",
  q:"구급함의 반창고 한 장. 누가 가져갔습니까?",ans:{sungmin:["몰라요.","정모 형이요. 팔에 붙인다고. …많이 다친 건 아니었으면 좋겠는데."],jeongmo:"네? 제가 왜요? 그날 앨런 선배가 손가락 다쳤다던데, 선배 아닐까요?"}},
 {id:"mk_sign",to:"sungmin",why:"그날 분장실에 있던 안성민",rb:{p:"jeongmo",t:["성민이 혼자 있었대잖아요.","저예요. 키트 빌리러 잠깐 들른 거예요."]},n:"출입 서명부",t:"14:00 안성민 입실. 다른 이름은 보이지 않는다.",s:"sungmin",
  q:"그날 분장실에 다녀간 사람이 정말 없습니까?",ans:{sungmin:["네. 혼자였어요.","…아니요. 한 명 왔었어요."]}},
 {id:"mk_texts",to:"sungmin",rb:{p:"wonjin",t:"‘다 말한다’… 선배가 사람 약점 잡을 때 쓰던 말이에요."},nl:1,n:"진혁의 문자",t:"성민의 휴대폰. 진혁이 보낸 문자: “오늘도 안 오면 내가 다 말한다.”",s:"sungmin",
  q:"‘다 말한다’는 것은 무엇을 말한다는 뜻입니까?",ans:{sungmin:"모르겠어요. 그만 물어보세요.",jeongmo:"음, 그 문자는 저도 처음 봐요."}},
 {id:"mk_erase",nn:"이름",n:"지운 이름",t:"서명부 17:00 칸에 지우개로 지운 이름. ‘ㄱ’ 획이 희미하게 남아 있다.",
  q:"서명부에서 지워진 이름. 누구의 것입니까?",u:{o:"jeongmo",r:2,y:"분장 키트 빌리러 갔었어요. 팔이 긁혀서 가리려고요. 그게 이상해요?",e:"제 이름이요? 음, 잘 안 보이는데요?"},ans:{wonjin:"‘ㄱ’이면… 구정모, 김태영, 강민희. 많네요.",taeyoung:"‘ㄱ’이요? 저 김씨이긴 한데, 분장실 갈 일 없어요.",minhee:"강씨긴 한데, 분장실은 안 갔어요.",allen:"저는 마씨입니다.",serim:"‘ㄱ’이요? 저는 박씨예요.",woobin:"저는 서씨예요. 동아리 사람도 아니고요.",hyungjun:"저는 송씨예요.",sungmin:["몰라요.","제가 지웠어요. 정모 형 이름이에요. 형은 키트만 빌려 간 거예요. 그게 다예요."]}},
 {id:"mk_puff",n:"두 가지 톤의 퍼프",t:"서랍 안쪽 퍼프 두 개. 하나는 진혁의 피부톤, 하나는 더 밝은 톤. 두 사람에게 분장을 했다.",
  q:"밝은 톤의 퍼프. 누구에게 사용한 것입니까?",u:{o:"jeongmo",r:3},ans:{wonjin:"분장은 성민이 담당이에요. 퍼프까지는 잘 모르겠네요.",minhee:"분장 안 받았어요. 연습도 없었는데요.",taeyoung:"그날 분장받은 사람이 있었어요? 연습도 취소됐는데.",allen:"저는 분장을 하지 않습니다.",sungmin:"제 거 아니에요. 전 그것보다 더 밝은 색 써요.",jeongmo:"퍼프요? 몰라요."}},
 {id:"mk_cotton",nn:"피",n:"피 묻은 화장솜",t:"분장실 휴지통의 화장솜. 진혁은 피를 흘리지 않았다. 다른 사람의 피다.",
  q:"화장솜의 혈흔. 누구의 것입니까?",u:{o:"jeongmo",r:1,y:"그거 제 피예요. 제가 다쳐서 그랬어요. 분장실에서 좀 닦았거든요."},ans:{wonjin:"피요? 그날 다친 사람이 있었나…",minhee:"제 피 아니에요.",taeyoung:"제 피 아니에요. 손등 긁힌 건 피도 안 났어요.",allen:"제 피가 아닙니다. 베인 손가락은 작업실에서 바로 지혈했습니다.",sungmin:"제 피 아니에요. 저 다친 데 없어요."}},
 {id:"mk_selfie",n:"10분 간격 셀카",t:"14:30부터 18:20까지 10분마다 찍은 분장 테스트 셀카. 16:20에도 17:20에도 성민은 분장실에 있었다.",a:[["sungmin","ok"]]},
 {id:"mk_polar",s2:["sungmin"],to:"jeongmo",rb:{p:"sungmin",t:"…친한 형이에요. 좋은 사람이고요."},nl:1,n:"폴라로이드",t:"성민의 서랍 속, 정모와 성민이 함께 찍은 사진. 뒷면에 ‘1주년’.",s:"jeongmo",
  q:"사진 속 두 사람. 어떤 관계입니까?",ans:{sungmin:"…친한 형이에요. 좋은 사람이고요.",jeongmo:"동아리 친구예요. 그게 다예요."}},
 // 연습실
 {id:"pr_bottle",nn:"물병",n:"어제 물병",t:"연습실 바닥에 물병 하나. 붙어 있는 날짜 메모는 어제. 오늘 것이 아니다.",
  q:"이 물병은 누구의 것입니까?",u:{o:"jeongmo",r:1,y:"그거 제 물병이에요. 어제 날짜요? 음… 오늘 깜빡하고 새로 안 가져왔나 봐요."},ans:{wonjin:"그건 정모 형 물병 같은데요. 맨날 그 물병이에요.",minhee:"정모 선배 물병 같은데요.",taeyoung:"정모 선배 물병이요. 연습 때마다 들고 다니던 거.",sungmin:"…정모 형 물병이에요."}},
 {id:"pr_tape",n:"Q47 마크",t:"바닥에 관 위치와 ‘Q47 여기서 기상’. 주연은 리프트 동선을 몸으로 안다.",s:"jeongmo"},
 {id:"pr_script",to:"jeongmo",nl:1,n:"“못 해”",t:"「관」 마지막 장면에 정모의 글씨로 ‘못 해’라고 적혀 있다.",s:"jeongmo",
  q:"‘못 해’라는 메모. 무슨 의미입니까?",ans:{jeongmo:["마지막 장면이 좀 어려워서요. 연기적으로요.","…그 장면은, 진짜 못 하겠더라고요."],wonjin:"정모 형이 마지막 장면만 계속 거부했어요. 연기 문제라고는 했는데… 지금 생각하면 좀 이상하네요."}},
 {id:"pr_dark",ex:{jeongmo:"정모는 연습실을 나가면서 불을 껐고, 에어컨은 고장 나서 찬바람만 나와 껐다고 한다."},to:"jeongmo",rb:{p:"sungmin",t:"나갈 때 불 끄는 건 당연하잖아요."},n:"꺼진 조명과 에어컨",t:"불을 켜 본다. 조명도 에어컨도 꺼져 있었다. 오후 내내 아무도 없었던 것 같다.",a:[["jeongmo","bad"]],
  q:"연습실은 조명도 에어컨도 꺼져 있었습니다. 설명하십시오.",ans:{jeongmo:"연습실 나가면서 껐어요. 당연한 거 아니에요? 에어컨은 고장 나서 찬바람만 계속 나오더라고요. 그래서 추웠던 거고, 나갈 때 껐어요."}},
 {id:"pr_diary",ex:{jeongmo:"정모는 요새 자주 깜빡한다고 한다."},to:"jeongmo",rb:{p:"sungmin",t:"형 요즘 잠을 잘 못 자서 자주 깜빡해요. 그게 다예요."},n:"비어 있는 칸",t:"정모는 연습 일지를 매일 쓴다. 그날 칸만 비어 있다.",a:[["jeongmo","bad"]],
  q:"그날 일지만 비어 있습니다. 이유를 설명하십시오.",ans:{jeongmo:"그날은 깜빡했어요."}},
 {id:"pr_cctv",n:"CCTV 고장",t:"복도 CCTV 고장. 지난주부터."},
 {id:"pr_photos",n:"단체사진들",t:"정모와 성민은 사진마다 나란히 서 있다."},
 {id:"pr_board",to:"wonjin",nl:1,n:"원진의 글씨",t:"“「관」 회의 — 소재 문제. 사람 상처로 극 쓰지 마.”",s:"wonjin",
  q:"이 문구, 본인이 쓴 것이 맞습니까? 누구에게 한 말입니까?",ans:{wonjin:"제가 쓴 글이에요. 선배 보라고. 들은 척도 안 하셨지만요."}},
 {id:"pr_keybox",rb:{p:"jeongmo",t:"열쇠는 누구나 만질 수 있어요. 저만 관리하는 게 아니에요."},to:"wonjin",why:"열쇠 관리를 아는 연출 함원진",n:"빈 열쇠 고리",t:"열쇠함의 ‘리프트·지하’ 이름표 고리가 비어 있다. 열쇠는 아직 돌아오지 않았다.",
  q:"리프트 열쇠가 열쇠함에 없습니다. 누가 가져갔습니까?",ans:{allen:"관을 실을 때 제가 빌렸습니다. 어제 저녁에 제자리에 두었습니다.",taeyoung:"그 열쇠 만질 일 있는 사람은 정해져 있죠. 저는 아니고요.",minhee:"열쇠요? 주연 담당이에요. 저랑은 상관없고요.",sungmin:"분장팀이라 그런 건 잘 몰라요.",jeongmo:"어? 열쇠가 없어요? 이상하다. 어제 연습 끝나고 분명히 넣어 뒀어요. 그 뒤로 누가 가져갔나 봐요.",wonjin:"주연이 부활 장면 연습 때문에 들고 다녀요. 보통 정모 형이 관리하죠."}},
 {id:"pr_log",to:"jeongmo",why:"연습실에 있었다는 구정모",n:"연습실 출입 0건",t:"그날 14시 이후 연습실 학생증 출입 0건.",a:[["jeongmo","bad"]],s:"jeongmo",ex:{jeongmo:"정모는 연습실에도 하역문 쪽으로 드나들어서 출입 기록이 없다고 한다."},
  q:"연습실 출입 기록이 0건입니다. 설명하십시오.",ans:{jeongmo:"저 연습실도 하역문 쪽으로 드나들어요. 학생증 찍는 문은 돌아가야 하거든요. 그래서 기록이 없을 거예요."}},
 {id:"pr_shirt",to:"jeongmo",rb:{p:"sungmin",t:"형은 소품 만지다 자주 다쳐요. 별일 아니에요. …많이 아팠어?"},n:"피 번진 소매",t:"정모의 운동가방 속 긴팔 상의. 소매 안쪽에 피가 번져 있다.",s:"jeongmo",
  q:"소매 안쪽의 혈흔. 설명하십시오.",ans:{jeongmo:"소품 철사에 긁혔어요. 별거 아니에요."}},
 {id:"pr_rx",nn:"처방전",n:"처방전 영수증 조각",t:"사물함 위에 신경정신과 처방전 영수증 조각. 수면제 처방. 이름 칸은 찢겨 있다.",
  q:"이 처방전은 누구의 것입니까?",u:{o:"jeongmo",r:2,y:"아… 제 처방전이에요. 불면증이 좀 있어서요. 하지만 제가 수면제 먹는 걸 아는 사람 많아요. 가끔 동방에서 잘 일도 있어서, 동방에도 구비해 두고 있고요."},ans:{wonjin:"남의 병원 기록까지는 모르겠네요.",minhee:"저 아니에요. 병원이랑 안 친해서요.",taeyoung:"저 병원 다닐 돈 없어요.",sungmin:"그건… 제가 말할 게 아니에요."}},
 // 소품 창고
 {id:"so_paint",to:"allen",why:"소품팀 마앨런",n:"검은 페인트와 물통",t:"앨런의 페인트. 붓 빤 물통에 검은 물이 남아 있다.",s:"allen",
  q:"이 페인트를 사용한 시각은 언제입니까?",ans:{allen:["관을 칠할 때 썼습니다. 오전입니다.","오후 한 시부터 두 시 오십 분까지 지하에서 썼습니다."]}},
 {id:"so_list",n:"없는 베개",t:"‘관 베개(보라) 1개 — 없음’."},
 {id:"so_resign",cond:[{who:"taeyoung",attr:["so_receipt","taeyoung"],t:"아까 말씀드렸잖아요. 탈퇴하려고 했다고요."}],to:"taeyoung",rb:{p:"wonjin",t:"태영아, 그거 진짜 낼 거였어? …나한테는 말을 하지."},nl:1,n:"탈퇴서 초안",t:"“더는 없는 사람처럼 있고 싶지 않습니다.” — 김태영",s:"taeyoung",
  q:"동아리를 탈퇴하려 했습니까?",ans:{taeyoung:["그게 왜 거기 있어요. 남의 가방은 왜 열어요?","네. 그날 그만두려고 했어요. 축하해 주실래요?"]}},
 {id:"so_box",n:"태영의 짐",t:"태영의 개인 짐을 싸다 만 상자.",s:"taeyoung"},
 {id:"so_receipt",cond:[{who:"taeyoung",qa:["so_resign",2],r:2,own:1,t:"제 영수증이에요. 그만두려고 짐 싸러 왔다가 배고파서 먹었어요."}],nn:"영수증",n:"편의점 영수증 16:35",t:"창고 바닥에 반쯤 먹은 삼각김밥과 편의점 영수증 16:35.",
  q:"이 영수증은 누구의 것입니까?",u:{o:"taeyoung",r:2,y:"제 영수증이에요. 그만두려고 짐 싸러 왔었어요. 비참해서 말 안 한 거예요. 만족하세요?",e:"아닌데요. 저 PC방 있었다니까요."},ans:{allen:"저는 창고에서 음식을 먹지 않습니다.",wonjin:"창고에서 삼각김밥 먹을 사람이면… 짐작은 가는데, 확실하진 않아요.",jeongmo:"저는 그 시간에 연습실에 있었는데요. 그 편의점, 태영이가 자주 가는 데예요."}},
 {id:"so_plan",n:"관 도면",t:"관 밑판이 리프트 판 크기에 맞춰 설계돼 있다. 관은 리프트에 실려 올라오는 소품이다."},
 {id:"so_back",to:"allen",rb:{p:"wonjin",t:"그 말, 선배가 저한테도 했어요. 연출 따위 없어도 된다고. 웃기죠."},n:"진혁의 쪽지",t:"도면 뒷면. “극이 없으면 소품팀도 디자이너도 필요 없어. 고마운 줄 알아.”",s:"allen",
  q:"이 쪽지의 의미를 설명하십시오.",ans:{allen:"그 사람이 늘 하던 말입니다. 2년 동안. 저는 정말 그런 줄 알았습니다."}},
 {id:"so_candy",to:"allen",why:"소품을 관리하는 마앨런",rb:{p:"taeyoung",t:"사탕이요. 저도 먹었어요. 그것도 죄예요?"},n:"소품 ‘수면제’ 병",t:"「관」 소품 수면제 병. 비어 있다.",
  q:"소품 수면제 병이 비어 있습니다. 누가 비웠습니까?",ans:{allen:"그건 사탕입니다. 리허설 때 배우들이 다 먹었습니다.",taeyoung:"사탕이요. 저도 먹었어요. 그것도 죄예요?"}},
 {id:"so_note",to:"wonjin",nl:1,n:"빨간 표시",t:"원진의 연출 노트. 진혁이 가져다 쓴 블로킹마다 빨간 표시. ‘내 거’.",s:"wonjin",
  q:"‘내 거’라는 표시는 무슨 의미입니까?",ans:{wonjin:"하하, 그거 보셨어요? 선배가 제 블로킹을 자기 아이디어처럼 말해서요. 소심한 복수였죠."}},
 {id:"so_candy2",n:"사탕 약병",t:"소품 약병엔 원래 사탕이 들어 있었다. 진짜 수면제와는 관계없다."},
 {id:"so_wall",n:"얇은 벽",t:"창고 벽이 무대 지하와 맞닿아 있다. 리프트 모터 소리가 그대로 들린다."},
 // 동아리방
 {id:"cl_mug",cond:[{who:"serim",attr:["cl_tissue","serim"],t:"컵은 아까 제가 깼다고 말씀드렸어요. 다투다가 그만 던졌어요."}],to:"serim",why:"그날 피해자를 만났다고 말한 유일한 사람, 박세림",n:"깨진 머그컵",t:"진혁의 머그컵이 깨져 있고 바닥에 커피 얼룩.",s:"serim",
  q:"이 머그컵을 깬 사람은 누구입니까?",ans:{serim:["…실수로 그랬어요.","제가 그랬어요. 다투다가, 그만. 지금 생각하면 부끄러워요."]}},
 {id:"cl_tissue",nn:"휴지",n:"발색 립밤 휴지",t:"코랄색 발색 립밤이 묻은 휴지.",
  q:"발색 립밤이 묻은 휴지. 누구의 것입니까?",u:{o:"serim",r:1,y:"네, 제 립밤이에요. 다퉜어요. 컵도 제가 던졌고요. 그래도 거기까지예요."},ans:{jeongmo:"립밤이요? 전 무색 립밤 써요.",wonjin:"발색 립밤이면… 그날 동아리방에 온 사람 중엔 세림 선배밖에 없는데요.",minhee:"립밤 안 발라요, 저.",taeyoung:"제가 코랄색 바를 것 같아요?",sungmin:"분장팀 립밤 아니에요. 그 색은 없어요.",allen:"제 휴지가 아닙니다. 저는 립밤을 쓰지 않습니다."}},
 {id:"cl_poster",n:"「관」 포스터",t:"공연일 11월 26일."},
 {id:"cl_frame",n:"첫 공연 사진",t:"진혁의 첫 공연 사진. 뒷면에 ‘2022.11.18’."},
 {id:"cl_board",n:"연습 취소",t:"화이트보드. “오늘 연습 취소 — 진혁”"},
 {id:"cl_minutes",to:"wonjin",why:"회의에 함께 있던 함원진",rb:{p:"jeongmo",t:["네. 회의록에 서명도 있잖아요.","근데 원진아, 너 정말 화장실 간 거 맞아?"]},n:"17:30 회의록",t:"17:30~18:30. 서명: 구정모, 함원진.",a:[["jeongmo","ok"],["wonjin","ok"]],
  q:"회의 내내 두 사람이 함께 있었습니까?",ans:{wonjin:["네, 여섯 시 반까지요. 지루한 회의였죠.",{t:"…아, 정정할게요. 중간에 제가 화장실 다녀왔어요. 그사이 정모 형 혼자 있었고요. 계속 손목을 감싸고 있었어요. 이건 농담 아니에요.",g:"tk_wonjin"}],jeongmo:"네. 회의록에 서명도 있잖아요."}},
 {id:"cl_ledger",to:"wonjin",why:"피해자와 가장 가까웠던 함원진",rb:{p:"sungmin",t:"그 술자리요. 저도 불려 갔어요. 더는 말 안 할게요."},nl:1,n:"취재비",t:"회비 장부. 진혁 이름의 ‘취재비’ 지출이 잦다. 무엇을 취재했을까?",
  q:"장부의 ‘취재비’는 어디에 쓰인 돈입니까?",ans:{wonjin:"술값이요. 선배는 술 사 주면서 사람 이야기를 모았어요. 저도 그렇게 털렸고요. 웃을 일은 아니죠.",sungmin:"그 술자리요. 저도 불려 갔어요. 더는 말 안 할게요."}},
 {id:"cl_draft",nn:"노트",to:"serim",nl:1,n:"「겨울 정류장」 초고 노트",t:"세림의 노트. 3년 치 수정 날짜가 빼곡하다. 진혁의 글씨는 첫 장 여백 한 줄뿐. ‘막차 끊긴 정류장 어때?’",s:"serim",
  q:"이 노트, 본인의 것이 맞습니까?",ans:{serim:"제 노트예요. 3년 동안 쓴 초고고요. 진혁이가 준 아이디어는, 첫 장의 그 한 줄이 전부예요."}},
 {id:"cl_parcel",cond:[{who:"woobin",qa:["rm_lease",1],t:"이삿짐 박스까지요? 와, 아예 체계적으로 튈 준비를 마쳤네요."}],to:"woobin",why:"피해자와 함께 사는 서우빈",nl:1,n:"이삿짐 박스",t:"진혁 앞으로 온 이삿짐 박스.",s:"woobin",
  q:"피해자가 이사를 준비하고 있었습니다. 알고 있었습니까?",ans:{woobin:"이사요? 와, 저한텐 한마디도 안 했어요. 이건 좀 아니죠."}},
 {id:"cl_kakao",qAlt:[{found:"pr_ac",q:"그날 연습실 에어컨이 추웠다고 했습니다. 하지만 에어컨 마지막 가동일은 사흘 전이었습니다."},{found:"pr_dark",q:"그날 연습실 에어컨이 추웠다고 했습니다. 하지만 연습실은 불도 에어컨도 모두 꺼져 있었습니다."}],rbAlt:[{found:"pr_ac",t:"형 요새 자주 깜빡하곤 하잖아. 사소한 문제인데 뭐."},{found:"pr_dark",t:"형이 고장이라고 했으면 고장이었던 거예요."}],cond:[{who:"jeongmo",found:"pr_ac",t:"감기 때문에 추웠나 봐요. 고장인 줄은 알고 있었지만, 리모컨은 확실히 눌렀어요. 저도 잘 모르겠어서 억울하네요."},{who:"jeongmo",found:"pr_dark",t:"그 에어컨 고장이에요. 찬바람만 계속 나와서 추웠던 거고, 나가면서 끈 거예요."}],to:"jeongmo",rb:{p:"sungmin",t:"형이 춥다고 했으면 추웠던 거예요."},n:"정모의 17:40 카톡",t:"동아리방 컴퓨터의 단톡방. 정모: “오늘 연습실 에어컨 너무 추웠음ㅠ”",a:[["jeongmo","ok"]],
  q:"그날 연습실 에어컨이 추웠다고 했습니다. 사실입니까?",ans:{jeongmo:["네, 엄청 추웠어요.","아… 그냥, 한 말이에요."]}},
 {id:"cl_shred",n:"새 종잇조각",t:"파쇄기 통의 가늘게 잘린 종이. 「관」 대본 글꼴이다. 맞춰 보면 마지막 독백 두 쪽.",
  q:"파쇄기에 대본을 넣은 사람은 누구입니까?",u:{o:"jeongmo",r:2,y:"원진이가 화장실 다녀온 사이에 필요 없는 서류랑 이전 대본을 정리했어요. 그러고 보니 원진이가 화장실에 꽤 오래 있었는데….",e:"파쇄기는 다들 쓰잖아요."},ans:{wonjin:["파쇄기요? 동아리방에 있긴 한데, 전 안 썼어요.", "제가 알기로 사건 당일 파쇄기를 사용한 사람은 정모 형이에요. 다른 사람도 썼는지는 모르겠어요."],minhee:"저 아니에요. 제가 버릴 거였으면 그냥 휴지통에 버렸죠.",taeyoung:"버릴 서류도 없는 사람이 파쇄기를 왜 써요.",sungmin:"저 아니에요. 분장팀은 파쇄할 서류도 없어요.",serim:"저는 아니에요. 진혁이랑 이야기만 하고 나왔어요.",allen:"제가 아닙니다. 저는 버릴 시안도 모아 두는 편입니다."}},
 {id:"cl_cafe",n:"카페 결제 기록",t:"학교 앞 카페, 15:02 아이스 아메리카노 2잔. 구정모 체크카드. 원진은 13:55와 16:10에 결제.",a:[["wonjin","ok"]],s:"jeongmo"},
 // 자취방
 {id:"rm_mail_s",to:"serim",nl:1,n:"세림과의 메일",t:"진혁: “공동 크레딧, 수익 반.” 세림: “네가 준 건 한 줄이었어.”",s:"serim",
  q:"피해자가 공동 크레딧을 요구한 것이 사실입니까?",ans:{serim:"보셨죠? 한 줄이었어요. 그걸로 제 3년을 반으로 나누자고 하더라고요."}},
 {id:"rm_mail_a",to:"allen",nl:1,n:"포스터 공모전 수상",t:"‘수상자: 강진혁’. 첨부된 포스터는 하수의 시안과 같다.",s:"allen",
  q:"이 포스터, 본인이 디자인한 것이 맞습니까?",ans:{allen:"네. 제 포스터입니다. 상장에는 그 사람 이름이 있습니다만."}},
 {id:"rm_mail_h",to:"hyungjun",rb:{p:"minhee",t:"형준이 기획서예요. 제 이야기고요."},nl:1,n:"다큐 기획 접수",t:"다큐 기획 공모전 접수 완료. 응모자 강진혁. 첨부 파일명 ‘송형준_졸작_최종.hwp’.",s:"hyungjun",
  q:"이 기획서, 본인의 것이 맞습니까?",ans:{hyungjun:"제 졸업작품이에요. 진혁 선배가 제 작품을 공모전에 본인 이름으로 제출한 거, 사실은 알고 있었어요.",minhee:"형준이 기획서예요. 제 이야기고요."}},
 {id:"rm_mail_t",rbFirst:1,to:"taeyoung",rb:{p:"wonjin",t:"이유요? 없어요. 그냥 싫어했어요. 그래서 제가 더 화가 났죠."},nl:1,n:"“태영은 빼자”",t:"진혁: “태영은 빼자. 난 걔 볼 때마다 별로야.” 원진: “안 돼요.”",s:"taeyoung",
  q:"피해자가 김태영 씨를 배제하려 한 이유는 무엇입니까?",ans:{taeyoung:"역시. 이유도 없었네요. 그럴 줄 알았어요.",wonjin:"이유요? 없어요. 그냥 싫어했어요. 그래서 제가 더 화가 났죠."}},
 {id:"rm_final",n:"「관」 최종고 예약 메일",t:"다음 주 월요일 원진에게 예약된 메일. 첨부: 관_최종고.zip (암호 걸림)."},
 {id:"rm_ending",to:"wonjin",why:"이 대본을 받기로 했던 연출 함원진",rb:{p:"jeongmo",t:"저는 몰랐던 일이에요. …알고 나니까, 죽이고 싶은 마음이 들긴 하네요. 이미 죽었지만."},nl:1,n:"「관」 마지막 독백",t:"부원들에게 나눠 준 대본에는 없던 마지막 독백. 끝까지 숨겨 온 주인공의 연인이 여기서 드러난다. 주연 배우와 분장팀 막내. 1주년, 분장실 커튼 뒤의 약속까지. 이름만 바꿨을 뿐, 정모와 성민을 가리키고 있다.",s:"jeongmo",
  q:"마지막 독백의 두 인물. 실제 모델이 누구입니까?",ans:{jeongmo:"저는 몰랐던 일이에요. …알고 나니까, 죽이고 싶은 마음이 들긴 하네요. 이미 죽었지만.",sungmin:"…",wonjin:"이건…."}},
 {id:"rm_notebook",to:"wonjin",why:"피해자를 가장 잘 아는 함원진",rb:{p:"serim",t:"저요? S는 맞지만, 저희는 그런 사이 아니에요. 그건 분명히 말할게요."},nl:1,n:"취재 노트",t:"용의자 9명을 포함한 주변인들의 약점이 적혀 있다. 한 항목만 암호처럼: “J와 S. 커튼콜은 둘이서.”",
  q:"‘J와 S’. 누구를 말하는 것입니까?",ans:{jeongmo:"J와 S요? 음, 진혁이랑 세림 선배일 수도 있잖아요.",serim:"저요? S는 맞지만, 저희는 그런 사이 아니에요.",sungmin:"몰라요.",wonjin:"짐작 가는 사람은 있어요. 근데 이건 장난으로 말할 게 아니라서요. 말 안 할게요."}},
 {id:"rm_cover",n:"표지의 낙서",t:"노트 표지에 점 9개를 잇는 선. 번호를 붙이면 1-2-3-5-7-8-9. Z 모양이다."},
 {id:"rm_lease",cond:[{who:"woobin",qa:["cl_parcel",1],t:"계약서까지요? 빚은 제 이름으로 두고, 아예 체계적으로 튈 준비를 마쳤네요."}],to:"woobin",why:"피해자와 함께 사는 서우빈",nl:1,n:"새 집 계약서",t:"다음 달 입주. 우빈은 모르는 계약이다.",s:"woobin",
  q:"피해자가 이사를 준비하고 있었습니다. 알고 있었습니까?",ans:{woobin:"다음 달이요? 와, 빚은 제 이름으로 두고 혼자 튀려고 했네요."}},
 {id:"rm_loan",to:"woobin",why:"그 집에 사는 서우빈",n:"우빈 명의 대출 서류",t:"우빈 명의 300만 원 대출 서류 사본. 누군가 서랍장을 뒤진 흔적.",s:"woobin",
  q:"서랍장을 뒤진 사람은 누구입니까?",ans:{woobin:["걔가 어지른 거겠죠, 뭐.","네, 제가 뒤졌어요. 차용증 찾으려고요. 서랍 모서리에 손등까지 긁혀 가면서요. 그건 인정해요."]}},
 {id:"rm_fridge",to:"woobin",why:"피해자와 함께 사는 서우빈",n:"우빈의 메모",t:"냉장고 문에 “월세 이번 달은 꼭.”",s:"woobin",nl:1,
  q:"피해자가 월세를 안 냈습니까?",ans:{woobin:"네, 넉 달째요. 그동안 제가 다 냈어요. 이번 달은 진짜 받아 낼 생각이었고요. 그렇다고 제가 뭐 했다는 건 아니에요."}},
 {id:"rm_door",to:"woobin",why:"그 집에 사는 서우빈",n:"도어락 기록",t:"14:12 입실, 18:00까지 출입 없음. 네 시까지 수업이었다는 우빈의 말과 다르다.",a:[["woobin","bad"]],s:"woobin",ex:{woobin:"우빈은 수업을 대리출석시키고 집에서 차용증을 찾고 있었다고 한다. 여섯 시까지는 집 밖에 나가지 않았다."},
  q:"두 시 십이 분에 집에 들어왔습니다. 네 시까지 수업이었다고 하지 않았습니까?",ans:{woobin:"…네, 수업은 대리출석 부탁했어요. 집에서 차용증 찾고 있었고요. 그래도 그 뒤로 여섯 시까지 집 밖에 안 나갔어요. 그건 도어락이 증명하잖아요."}},
 {id:"rm_pills",n:"진혁의 약통",t:"수면제는 없다. 처방 기록도 없다. 진혁이 스스로 먹은 약이 아니다."},
 {id:"rm_msg",n:"17:55 문자의 말투",t:"평소 진혁: ‘ㅇㅇ’, ‘늦음 먼저 자’. 17:55 문자만 “오늘 늦게 끝날 것 같아. 먼저 자.” 마침표와 띄어쓰기가 완벽하다."},
 {id:"so_cutter",to:"allen",why:"소품을 만드는 마앨런",nl:1,n:"보라색 실밥이 낀 커터칼",t:"작업대의 커터칼. 날 틈에 보라색 천 실밥이 끼어 있고, 칼날 끝에는 마른 피가 조금 묻어 있다.",s:"allen",
  q:"이 커터칼, 본인의 것이 맞습니까?",ans:{allen:"제 칼입니다. 관에 넣을 보라색 베개 커버를 이걸로 잘랐습니다. 피는 제 손가락 피입니다. 그날 커터칼에 베였습니다."}},
 {id:"up_glove",to:"taeyoung",why:"이름이 적힌 김태영",nl:1,n:"태영의 목장갑",t:"리프트 조작반 아래에 떨어진 목장갑 한 짝. 손목 밴드에 매직으로 ‘김태영’.",s:"taeyoung",
  q:"리프트 조작반 아래에서 당신의 장갑이 나왔습니다. 설명하십시오.",ans:{taeyoung:"제 거 맞아요. 근데 그거 지난주 세트 작업 때 잃어버린 거예요. 찾아 달라고 했을 땐 아무도 안 찾아 주더니. 조작반은 저 만질 줄도 몰라요."}},
 {id:"st_serim",to:"serim",why:"카톡을 보낸 박세림",nl:1,n:"세림의 카톡",t:"카톡 알림창. 16:05 세림: “그 대본 그대로 올리면, 나 정말 가만 안 있어.” 진혁은 읽지 않았다.",s:"serim",
  q:"‘가만 안 있겠다’는 카톡. 무슨 뜻입니까?",ans:{serim:"학교에 정식으로 문제 삼겠다는 뜻이었어요. 표절로요. 그 시간에 저는 대학로에서 리허설 쉬는 틈에 보낸 거고요."}},
 {id:"rm_pass",to:"woobin",why:"이름이 적힌 서우빈",nl:1,n:"우빈의 스태프 출입증",t:"소극장 공연 스태프 출입증. 이름 칸에 ‘서우빈’. 날짜는 지난달.",s:"woobin",
  q:"연극부와 관련이 없다고 했습니다. 이 출입증은 무엇입니까?",ans:{woobin:"아, 그거요. 지난달에 진혁이가 일손 모자란다고 하루 불러서 무대 설치 도와준 거예요. 하루요. 그걸로 연극부 사람 되는 건 아니잖아요."}},
 {id:"cl_pills",nn:"수면제",n:"동방 구급함의 수면제",t:"동아리방 구급함 속 수면제 한 통. 라벨은 없다. 몇 알이 비어 있다. 구급함은 잠겨 있지 않아 누구나 열 수 있다.",
  q:"이 수면제는 누구의 것입니까?",u:{o:"jeongmo",r:1,y:"제 거예요. 동방에서 잘 때 먹으려고 둔 거요. 근데 구급함이라 누구나 열 수 있어요. 다들 알고요."},ans:{wonjin:"그 구급함 다들 써요. 수면제가 있는 줄은 몰랐네요.",minhee:"전 안 먹어요. 누가 먹는지는 알 것 같기도 하고.",taeyoung:"동방 구급함이요? 저도 열어 본 적 있어요. 누구나 열죠.",sungmin:"…그건 제가 말할 게 아니에요.",serim:"전 이미 졸업해서 동방에 있는 물건에 대해선 잘 몰라요."}},

const STEPS=[["intro","—. 사건 설명"],["s0","0. 용의자 설명"],["s1","1. 피해자와의 관계"],["s2","2. 알리바이"],["inv1","3. 1차 현장 검증"],["acc1","4. 용의자 지목"],["inv2","5. 2차 현장 검증"],["acc2","6. 용의자 지목"],["final","7. 결정적 증거"],["end","엔딩"],["truth","진범"]];

/* ================== 상태 ================== */
const KEY="crabity-murder-v23";
const fresh=()=>({phase:"title",done:[],found:[],unl:[],attr:{},qa:{},used:{1:0,2:0},loc:"stage",sub:null,last:null,pop:false,r2seen:false,lockOpen:null,lockErr:"",
  pick:null,accused:null,fz:0,fzLog:[],chUsed:[],defShown:false,flash:"",ch:0,strikes:0,chPick:null,chPrev:[],chTries:[],ending:null,endWho:null,
  nb:false,ntab:"alibi",askFor:null});
let S=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.phase)S=Object.assign(fresh(),s,{nb:false,askFor:null})}catch(e){}
/* 저장된 대화 기록의 오타 바로잡기 */
try{Object.entries(S.qa||{}).forEach(([id,log])=>{const c=CM[id];if(!c)return;for(let k=log.length-1;k>=0;k--){const x=log[k];if(!x[4])continue;if(!c.rb||x[0]!==c.rb.p){if(!(c.rbAlt&&x[0]===c.rb?.p))log.splice(k,1);continue;}if(typeof c.rb.t==="string"&&!c.rbAlt)x[1]=c.rb.t;}})}catch(e){}
try{Object.entries(S.qa||{}).forEach(([id,log])=>{const c=CM[id];if(!c||!c.ans)return;log.forEach(x=>{if(x[4]||x[2])return;const w=x[0];if((c.cond||[]).some(k=>k.who===w))return;let a=c.ans[w];if(a===undefined)return;if(Array.isArray(a))a=a[Math.min(x[5]||1,a.length)-1];const t=a&&typeof a==="object"?a.t:a;if(typeof t==="string")x[1]=t;})})}catch(e){}
try{Object.values(S.qa||{}).forEach(log=>log.forEach(x=>{if(typeof x[1]==="string"){x[1]=x[1].replace("넝 달째요","넉 달째요").replace("잖원진아","잖아, 원진아").replace("체계적으로 준비까지 마쳤네요","체계적으로 튈 준비를 마쳤네요").replace("에이, 화장실은 잠깐이었잖아, 원진아.","근데 원진아, 너 정말 화장실 간 거 맞아?");if(x[0]==="jeongmo")x[1]=x[1].replace(/(^|“)아, /g,"$1").replace(/ 아, /g," ")}}))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const round=()=>["inv2","acc2","final","end","truth"].includes(S.phase)?2:1;
const has=id=>S.found.includes(id);
const did=id=>S.done.includes(id);
const hash=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%100003;return h};
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function subDone(sub){
  return A.filter(a=>a.l===sub&&actVisible(a)).every(a=>{
    if(a.lock&&!S.unl.includes(a.lock))return false;
    if(a.open)return did(a.id)&&subDone(a.open);
    return did(a.id);
  });
}
function actVisible(a){
  if(a.r>round())return false;
  if(a.p&&!did(a.p))return false;
  if(a.k&&!S.unl.includes(a.k))return false;
  if(a.need&&!has(a.need))return false;
  if(a.lock&&!a.open&&S.unl.includes(a.lock))return false;
  return true;
}
const locOpen=L=>L.r<=round();
const locLocked=L=>L.lock&&!S.unl.includes(L.lock);

/* ================== 공통 ================== */
function header(){
  const i=STEPS.findIndex(s=>s[0]===S.phase);
  document.body.classList.toggle("ontitle",S.phase==="title");
  if(i<0){$("steplabel").textContent="";$("steps").innerHTML="";$("nbcount").textContent=S.found.length;return;}
  $("steplabel").textContent=STEPS[i][1];
  $("steps").innerHTML=STEPS.slice(0,9).map((s,j)=>`<i class="${j===i?"on":j<i?"done":""}"></i>`).join("");
  $("nbcount").textContent=S.found.length;
}
function go(ph){S.finalAsk=false;S.preAcc=false;S.phase=ph;S.last=null;S.pick=null;S.defShown=false;S.flash="";S.askFor=null;save();render();window.scrollTo(0,0)}
const avatar=p=>`<span class="av">${p.init}</span>`;
function bubble(p,text,me){return `<div class="say ${me?"me":""}">${me?"":avatar(p)}<div class="bub"><span class="who">${me?"탐정":esc(p.name)}</span>${esc(text)}</div></div>`}

/* ===== 추궁 ===== */
function resolveAns(a){
  if(Array.isArray(a))a=a[Math.min(round(),a.length)-1];
  if(a&&typeof a==="object")return {t:a.t,g:a.g};
  return {t:a};
}


const ga=N=>{const c=N.charCodeAt(N.length-1);return (c-44032)%28?"이":"가"};
const OWNN={serim:N=>`제 ${N} 아니에요. 처음 보네요.`,allen:N=>`제 ${N}${ga(N)} 아닙니다.`,jeongmo:N=>`에이, 제 ${N} 아니에요.`,woobin:N=>`에이, 제 ${N} 아니에요.`,
 wonjin:N=>`제 ${N} 아니에요. 그건 확실해요.`,minhee:N=>`제 ${N} 아니에요.`,hyungjun:N=>`제 ${N} 아니에요. 처음 봐요.`,taeyoung:N=>`제 ${N} 아닌데요. 증거 있어요?`,sungmin:N=>`제 ${N} 아니에요.`};
const ownLine=(c,who)=>c.nn?OWNN[who](c.nn):rnd(VOICE[who].own);
const altOn=c=>c.toAlt&&S.attr[c.toAlt.attr[0]]===c.toAlt.attr[1];
const toOf=c=>altOn(c)?c.toAlt.to:c.to;
const pickAlt=a=>a?[].concat(a).find(x=>has(x.found)):null;
const qOf=c=>{if(altOn(c))return c.toAlt.q;const a=pickAlt(c.qAlt);return a?a.q:c.q};
function qtype(c){
  if(c.qt)return c.qt;
  if(c.q.includes("의 것"))return "own";
  if(/누가|누구입니까|사람은 누구|발신자는 누구|다녀간 사람/.test(c.q))return "who";
  return "other";
}
function fallback(c,who,R){
  const v=VOICE[who],p=PM[who],L=CLOC[c.id],name=c.nl?null:LOCN[L],type=qtype(c);
  if(type==="who"&&name&&!PRES[who][R-1].includes(L))return v.wl(name);
  if(name&&!FAM[who].includes(L)&&!PRES[who][R-1].includes(L))return v.wk(name);
  if(v.stg&&type!=="who"&&STAGE.includes(L)&&!c.nl)return v.stg;
  if(type==="own")return ownLine(c,who);
  if(type==="who")return rnd(v.who);
  return rnd(p.idk);
}
function ask(id,who){
  const c=CM[id],p=PM[who],R=round();
  let t,yes=false,gave=null;
  let rb=null;
  if(c.rb&&who===c.to){const r=resolveAns(pickAlt(c.rbAlt)?pickAlt(c.rbAlt).t:c.rb.t);rb=[c.rb.p,r.t,0,null,1,R];if(r.g&&!has(r.g)){S.found.push(r.g);rb[3]=r.g;}}
  const cd=(c.cond||[]).find(x=>x.who===who&&(!x.attr||S.attr[x.attr[0]]===x.attr[1])&&(!x.found||has(x.found))&&(!x.r||R>=x.r)&&(!x.qa||(S.qa[x.qa[0]]||[]).some(e=>e[0]===who&&!e[4]&&e[5]>=x.qa[1])));
  if(cd){t=cd.t;if(cd.own){yes=true;S.attr[id]=who;}}
  else if(c.u&&who===c.u.o&&c.u.r<=R){t=c.u.y;yes=true;S.attr[id]=who;if(c.u.also&&has(c.u.also))S.attr[c.u.also]=who;}
  else if(c.ans&&c.ans[who]!==undefined){const r=resolveAns(c.ans[who]);t=r.t;if(r.g&&!has(r.g)){S.found.push(r.g);gave=r.g;}}
  else if(c.u&&who===c.u.o)t=c.u.e||ownLine(c,who);
  else t=fallback(c,who,R);
  const log=S.qa[id]=S.qa[id]||[];
  if(!log.some(x=>x[0]===who&&x[1]===t))log.push([who,t,yes?1:0,gave,0,R]);else log.find(x=>x[0]===who&&x[1]===t)[5]=R;
  if(rb&&!log.some(x=>x[0]===rb[0]&&x[1]===rb[1])){if(c.rbFirst){const i=log.findIndex(x=>x[0]===who&&x[1]===t);log.splice(i,0,rb);}else log.push(rb);}
  if(yes&&S.nb&&S.ntab==="unk"){S.nbFound=[id,who];setTimeout(()=>{const f=document.getElementById("nbfound");if(f)f.scrollIntoView({block:"center",behavior:"smooth"});},60);setTimeout(()=>{S.nbFound=null;save();if(S.nb&&S.ntab==="unk"){const nb=$("nbody"),y=nb.scrollTop;renderNote();nb.scrollTop=y;}},2800);}
  S.lastWho=S.lastWho||{};S.lastWho[id]=who;
  S.askFor=null;save();render();
}
function qaBlock(id,compact){
  const c=CM[id];if(!c.q)return "";const to=toOf(c);
  const log=S.qa[id]||[];
  let h="";
  let show=log;
  if(compact&&!to&&S.lastWho&&S.lastWho[id]){const lw=S.lastWho[id];show=log.filter(x=>x[0]===lw&&!x[4]).slice(-1);}
  if(show.length)h+=`<div class="qa">${show.map(([w,t,y,g,r],i)=>`${(c.rbFirst?(r||!(log[i-1]&&log[i-1][4])):!r)?`<div class="q">${to?esc(PM[to].name)+"에게: ":""}${esc(qOf(c))}</div>`:""}<div class="a ${y?"yes":""} ${g?"gave":""} ${r?"rb":""}"><b>${esc(PM[w].name)}${r?" · 끼어든다":""}</b>${esc(t)}${y?"<i style=\"color:#2c5d9a\">→ 주인 확인</i>":""}${g?`<i>→ 새 진술: ${esc(CM[g].n)}</i>`:""}</div>`).join("")}</div>`;
  const R=round(),askedNow=w=>log.some(x=>x[0]===w&&!x[4]&&x[5]===R);
  if(to&&(altOn(c)||!(c.u&&!S.attr[id]))){
    const changes=Array.isArray(c.ans&&c.ans[to])||(c.rb&&Array.isArray(c.rb.t));
    const asked=askedNow(to)||(R===2&&!changes&&log.some(x=>x[0]===to&&!x[4]));
    if(S.phase!=="end"&&!asked)h+=`<button class="ask" data-askwho="${to}" data-askid="${id}">${esc((altOn(c)?c.toAlt.why:c.why)||PM[to].name)}에게 묻는다 — ${esc(qOf(c))}</button>`;
    return h;
  }
  if(c.u&&S.attr[id])return h;
  const left=P.filter(p=>!askedNow(p.id));
  if(!left.length||S.phase==="end")return h;
  if(S.askFor===id)h+=`<span class="askq">“${esc(qOf(c))}” — 누구에게 물을까?</span><div class="pick">${left.map(p=>`<button data-askwho="${p.id}" data-askid="${id}">${p.name}</button>`).join("")}<button data-askcancel>그만두기</button></div>`;
  else h+=log.length?`<button class="ask" data-ask="${id}">다른 사람에게 물어본다</button>`:`<button class="ask" data-ask="${id}">${esc(qOf(c))}</button>`;
  return h;
}

  ${S.cf?`<div class="pop-ov"><div class="pop"><div class="casefile">
   <div class="cfhead"><span>사건 파일</span><span>크래비티 소극장 · 정기공연 3주 전</span></div>
   <section><h3>사건 개요</h3><p>정기공연을 3주 앞둔 연극부 ‘크래비티’의 소극장에서 부원 한 명이 숨진 채 발견됐다. 그날 오후 3시부터 5시까지 잡혀 있던 연습이 오전에 갑자기 취소되어, 극장은 하루 종일 거의 비어 있었다. 학교는 외부 탐정인 당신에게 수사를 의뢰했다.</p></section>
   <section><h3>피해자</h3><p><b>강진혁</b> · 24세 · 연극부 작가. 이번 정기공연에 올릴 신작 「관(棺)」을 쓰고 있었다. 대본은 마지막 독백만 빼고 이미 부원들에게 공개됐고, 마지막 독백은 최종고와 함께 공개할 예정이었다. 동갑 친구 서우빈과 자취방에서 함께 살았다.</p></section>
   <section><h3>발견</h3><p>밤 9시 30분, 순찰 중이던 학교 경비가 무대 한가운데 놓인 소품 관 안에서 시신을 발견했다. 핀 조명 하나가 관만 비추고 있었고, 뚜껑은 반쯤 열려 있었다.</p>
    <p class="quote">“학생이 두 손을 가슴에 모으고, 꼭 잠든 것처럼 누워 있었어요. 처음엔 소품인 줄 알았어요.” — 학교 경비</p></section>
   <section><h3>사인</h3><p>겉으로 드러난 외상은 없다. 얼굴은 무대 분장으로 곱게 덮여 있었다. 약물 반응과 질식 여부는 정밀 부검 결과를 기다리는 중이다.</p></section>
   <section><h3>사망 추정 시간</h3><p><b>오후 2시 40분 ~ 오후 6시</b></p>
    <ul><li>마지막 목격: 14:40, 동아리방. 연출가 박세림과 대화를 나눴다.</li><li>17:55, 피해자의 휴대폰에서 룸메이트 서우빈에게 “오늘 늦게 끝날 것 같아. 먼저 자.”라는 문자가 왔다. 이 문자대로라면 그때까지 살아 있었다.</li></ul></section>

    const acts=A.filter(a=>rootOf(a.l)===l.id&&actVisible(a)&&!a.lock&&!a.open);

function bindPattern(svg){
  const k=svg.dataset.pattern,line=svg.querySelector("polyline"),dots=[...svg.querySelectorAll("circle.dot")];
  let seq=[],drawing=false,pts=[];
  const pos=e=>{const r=svg.getBoundingClientRect();return [(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*300/r.height]};
  const hit=([x,y])=>{for(const d of dots){const dx=x-+d.getAttribute("cx"),dy=y-+d.getAttribute("cy");if(dx*dx+dy*dy<38*38&&!seq.includes(d.dataset.i)){seq.push(d.dataset.i);d.classList.add("on");pts.push(d.getAttribute("cx")+","+d.getAttribute("cy"));}}};
  const draw=cur=>{line.setAttribute("points",pts.join(" ")+(cur&&pts.length?" "+cur.join(","):""))};
  svg.addEventListener("pointerdown",e=>{e.preventDefault();const er=svg.parentElement.querySelector(".err");if(er)er.remove();drawing=true;seq=[];pts=[];dots.forEach(d=>d.classList.remove("on"));svg.setPointerCapture(e.pointerId);const p=pos(e);hit(p);draw(p);});
  svg.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);hit(p);draw(p);});
  const end=()=>{if(!drawing)return;drawing=false;draw();if(seq.length)tryLock(k,seq.join(""));};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
}

}

const MOTIVE=["진혁은 주변인들의 약점을 소재로 삼는다. 이번 타깃은 정모와 성민이었다. 「관」의 마지막 독백은 정모와 성민 두 사람을 이름만 바꿔 무대에 세우려 하고 있었다. 주위의 응원과 지지를 받지 못하는 비극적인 사랑이 얼마나 아름답냐며.",
 "사건 당일, 「관」의 마지막 독백을 바꿔 달라고 찾아간 정모 앞에서 진혁은 성민을 두고 입에 담지 못할 말을 늘어놓았다.",
 "성민은 진혁을 싫어했다. 이유는 끝내 말하지 않았다. 정모도 몰랐다. 진혁은 술자리마다 성민을 불러냈고, 추행했으며, 분장실 커튼 틈으로 성민을 몰래 찍고 있었다.",
 "진혁은 몰래 찍은 성민의 사진을 웃으며 넘겨 보이면서, 성민의 연인인 정모 앞에서 성민을 희롱했다. 정모는 성민이 그동안 혼자 견뎌 온 것을 처음 알게 되었다.",
 "정모는 성민을 지키기 위해, 진정한 극의 막을 직접 올렸다."];
const evsHTML=()=>`<div class="truth"><span class="eyebrow">결정적 증거 — 정모를 무너뜨리는 다섯 장면</span>${CH.map((ch,i)=>{const u=S.ending==="true"&&S.chUsed&&S.chUsed[i];return `<div class="tr"><b>${i+1}</b><p><strong>${esc(ch.why)}</strong>${esc(ch.use)}<small>${u?"내가 제시한 증거 · "+esc(CM[u].n):(S.ending==="true"?"제시하지 못하고 넘어갔다 · ":"쓸 수 있었던 증거 · ")+ch.ok.map(x=>esc(CM[x].n)).join(" / ")}</small></p></div>`}).join("")}</div>`;
function truthView(){
  const p=PM.jeongmo,got=S.ending==="true";
  return `<div class="truthpage">
   <span class="eyebrow">THE TRUTH</span>
   <h1>진범 구정모.</h1>
   <p class="hint">${got?"당신은 그를 무너뜨렸다.":"당신이 놓친 사람. 무대에서 가장 밝게 웃던 주연 배우."} 24세 · 연극부 주연 배우.</p>
   <section><h3>범행 동기</h3><div class="prose">${MOTIVE.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
   <p class="line">“사랑하는 사람을 세상에 숨겨야 한다는 건 죽음과 다름없다.<br>사랑이 없는 삶은 죽음이다.”</p>
   <p class="retort">사랑하는 사람을 세상에 숨겨야 한다는 건 죽음과 다름없다고?<br><b>아니, 사랑하는 사람을 지키지 못하는 게 죽음과 다름없어.</b></p></section>
   <section><h3>사건 개요</h3>${truthHTML()}</section>
   <section><h3>결정적 증거</h3>${evsHTML()}</section>
   <div class="row2"><button class="ghost" data-toend>엔딩으로 돌아가기</button><button class="primary" data-reset>처음부터 다시</button></div></div>`;
}
function endView(){
  const E=S.ending,btns=`<div class="row2"><button class="ghost" data-opennb>탐정 노트 보기</button><button class="primary" data-reset>처음부터 다시</button></div>`;
  const tr=`<div class="row2 truthbtns">${E!=="true"&&!S.showTruth?`<button class="ghost" data-reacc>범인 다시 지목하기</button>`:""}<button class="primary" data-truth>진범 확인하기</button></div>`;
  if(E==="true")return `<div class="ending true"><span class="eyebrow">ENDING · 커튼콜</span><h1>커튼콜</h1>
   <div class="prose"><p>정모는 한참 동안 소매를 내려다보다가, 천천히 걷어 올렸다. 손목에 손톱자국이 선명했다.</p>
   <p>“성민이는 아무것도 몰랐어요.” 처음으로, 정모의 얼굴에서 웃음기가 사라졌다. “탐정님, 성민이한테는 그렇게 전해 주세요. 너는 아무것도 몰랐다고.”</p>
   <p>취조실 문이 닫히기 전, 정모는 무대에서 끝내 하지 못한 대사를 했다.</p></div>
   <p class="line">“사랑하는 사람을 세상에 숨겨야 한다는 건 죽음과 다름없다.<br>사랑이 없는 삶은 죽음이다.”</p>
   ${tr}</div>${btns}`;
  if(E==="escape")return `<div class="ending bad"><span class="eyebrow">ENDING · 막은 내렸지만</span><h1>막은 내렸지만</h1>
   <div class="prose"><p>증거가 부족했다. 정모는 풀려났다. 「관」은 무대에 오르지 못했고, 최종고는 어디에도 남지 않았다.</p><p>복도를 걸어 나가는 정모의 소매 끝으로, 손톱자국이 잠깐 보였다가 사라졌다.</p></div>${tr}</div>${btns}`;
  if(E==="standin")return `<div class="ending bad"><span class="eyebrow">ENDING · 대역</span><h1>대역</h1>
   <div class="prose"><p>“제가 했어요.” 성민은 담담하게, 너무 쉽게 자백했다. 셀카 기록이 그를 가리키지 않는데도.</p><p>면회실 유리 너머로 정모가 고개를 숙였다. 성민이 지키려던 사람은 따로 있었다.</p><p>성민이 그 선배를 싫어했던 진짜 이유는, 끝내 조서에 적히지 않았다.</p></div>${tr}</div>${btns}`;
  const p=PM[S.endWho];
  return `<div class="ending bad"><span class="eyebrow">ENDING · 오답</span><h1>${p.name}의 비밀</h1>
   <div class="prose"><p>${esc(p.wrong)}</p><p>진범은 끝내 무대 뒤로 사라졌다.</p></div>${tr}</div>${btns}`;
}

/* ================== 탐정 노트 ================== */
function saidBy(c,who){
  const log=(S.qa[c.id]||[]).filter(x=>x[0]===who);
  if(!c.q)return "";
  if(!log.length)return `<div class="qa"><div class="q">${esc(qOf(c))}</div><div class="a"><b>${esc(PM[who].name)}</b><span style="color:var(--muted)">아직 묻지 않았다.</span></div></div>${S.phase!=="end"?`<button class="ask" data-askwho="${who}" data-askid="${c.id}">${esc(PM[who].name)}에게 묻는다</button>`:""}`;
  return `<div class="qa"><div class="q">${esc(qOf(c))}</div>${log.map(([w,t,y,g,r])=>`<div class="a ${y?"yes":""} ${r?"rb":""}"><b>${esc(PM[w].name)}${r?" · 끼어든다":""}</b>${esc(t)}</div>`).join("")}</div>`;
}
const NTABS=[["case","사건 개요"],["alibi","알리바이"],["sus","의심 증거"],["unk","주인 모를 증거"],["all","전체 단서"]];
function noteClue(c){
  return `<div class="ncard"><h4>${esc(c.n)}${lvStamp(c)}</h4><p>${esc(c.t)}</p>${lvNote(c)}${qaBlock(c.id)}</div>`;
}
function renderNote(){
  $("overlay").hidden=!S.nb;if(!S.nb)return;
  const unk=S.found.filter(id=>CM[id].u&&(!S.attr[id]||(S.nbFound&&S.nbFound[0]===id)));
  $("ntabs").innerHTML=NTABS.map(([k,n])=>`<button class="ntab ${S.ntab===k?"on":""}" data-ntab="${k}">${n}${k==="unk"?" "+unk.length:""}</button>`).join("");
  let h="";
  if(S.ntab==="case"){
    const extra=["st_petechia","st_tox"].filter(has).map(id=>`<li><b>${esc(CM[id].n)}</b> · ${esc(CM[id].t)}</li>`).join("");
    h=`<div class="ncard casesum">
      <h4>사건 개요</h4><p>정기공연 3주 전, 연극부 ‘크래비티’의 소극장에서 부원 한 명이 숨진 채 발견됐다. 연습이 오전에 취소돼 극장은 하루 종일 거의 비어 있었다.</p>
      <h4>피해자</h4><p><b>강진혁</b> · 24세 · 연극부 작가. 신작 「관(棺)」 집필 중. 대본은 마지막 독백만 빼고 부원들에게 공개됐다. 서우빈과 자취.</p>
      <h4>발견</h4><p>밤 9시 30분, 경비가 무대 한가운데 소품 관 속에서 발견. 핀 조명 하나가 관을 비추고 있었고, 두 손을 가슴에 모은 채 잠든 것처럼 누워 있었다.</p>
      <h4>사인</h4><p>겉으로 드러난 외상 없음. 얼굴은 무대 분장으로 덮여 있었다.</p>${extra?`<ul>${extra}</ul>`:`<p class="sub">정밀 부검 결과 대기 중.</p>`}
      <h4>사망 추정 시간</h4><p><b>14:40 ~ 18:00</b></p><ul><li>마지막 목격 14:40 · 동아리방, 박세림과 대화</li><li>17:55 · 피해자 휴대폰에서 서우빈에게 “오늘 늦게 끝날 것 같아. 먼저 자.”</li></ul>
      <h4>수사 현황</h4><p>${round()}차 현장 검증 · 찾은 증거 ${S.found.length}개</p>
    </div>`;
  }else if(S.ntab==="alibi"){
    h=P.map(p=>{
      const ev=S.found.map(id=>CM[id]).filter(c=>(c.a||[]).some(a=>a[0]===p.id));
      const oks=ev.filter(c=>c.a.some(a=>a[0]===p.id&&a[1]==="ok")),bads=ev.filter(c=>c.a.some(a=>a[0]===p.id&&a[1]==="bad"));
      const thin=["minhee","hyungjun"].includes(p.id);
      const st=bads.length?["bad","반박됨"]:oks.length?["ok","확인"]:thin?["thin","증거 부족"]:["none","미확인"];
      return `<div class="ncard"><h4>${p.name} <span class="stamp ${st[0]}">${st[1]}</span></h4>
        <p class="claim ${bads.length?"struck":""}">${esc(p.claim)}</p>
        ${oks.map(c=>`<div class="ev ok"><b>${esc(c.n)}</b> — ${esc(c.t)}</div>`).join("")}
        ${bads.map(c=>`<div class="ev bad"><b>${esc(c.n)}</b> — ${esc(c.t)}${c.ex&&c.ex[p.id]&&(S.qa[c.id]||[]).length?`<span class="exc">↳ 해명: ${esc(c.ex[p.id])}</span>`:""}</div>`).join("")}
        ${!ev.length?`<div class="claim">${thin?"서로의 진술 말고는 알리바이를 뒷받침할 증거가 없다.":"아직 알리바이를 뒷받침하거나 반박할 증거가 없다."}</div>`:""}</div>`;
    }).join("");
  }else if(S.ntab==="sus"){
    const by={};
    S.found.forEach(id=>{const c=CM[id];[c.s,...(c.s2||[]),S.attr[id]].filter(Boolean).forEach(w=>{(by[w]=by[w]||[]);if(!by[w].includes(c))by[w].push(c)})});
    const ids=P.map(p=>p.id).filter(id=>by[id]);
    h=ids.length?ids.map(id=>`<div class="nsec"><h4>${PM[id].name}</h4>${by[id].map(c=>`<details class="ncard fold" data-fold="${id}:${c.id}" ${S.fold&&S.fold[id+":"+c.id]?"open":""}><summary><span>${esc(c.n)}${lvStamp(c)}</span></summary><div class="fb"><p>${esc(c.t)}</p>${lvNote(c)}${saidBy(c,id)}</div></details>`).join("")}</div>`).join(""):`<div class="nempty">아직 누군가를 가리키는 증거가 없다.</div>`;
  }else if(S.ntab==="unk"){
    h=`<p class="claim">누구 것인지 모르는 증거. 용의자에게 들고 가서 물어볼 수 있다. 주인이 인정하면 ‘의심 증거’로 옮겨진다.</p>`+(unk.length?unk.map(id=>S.nbFound&&S.nbFound[0]===id?`<div class="ncard found" id="nbfound"><h4>${esc(CM[id].n)}</h4><p>${esc(CM[id].t)}</p>${qaBlock(id)}<div class="foundbar">증거의 주인을 찾았다!<b>「${esc(CM[id].n)}」의 주인은 ${esc(PM[S.nbFound[1]].name)}.</b><small>‘의심 증거’의 ${esc(PM[S.nbFound[1]].name)} 칸으로 옮긴다.</small></div></div>`:noteClue(CM[id])).join(""):`<div class="nempty">주인을 모르는 증거가 없다.</div>`);
  }else{
    h=LOCS.map(l=>{const list=S.found.filter(id=>CLOC[id]===l.id);if(!list.length)return "";
      return `<div class="nsec locgroup"><h4>${l.name} · ${list.length}</h4>${list.map(id=>noteClue(CM[id])).join("")}</div>`}).join("")||`<div class="nempty">아직 찾은 단서가 없다.</div>`;
  }
  const b=$("nbody");b.innerHTML=h;
  b.querySelectorAll("[data-fold]").forEach(d=>d.addEventListener("toggle",()=>{S.fold=S.fold||{};S.fold[d.dataset.fold]=d.open;save();}));
  $("ntabs").querySelectorAll("[data-ntab]").forEach(x=>x.onclick=()=>{S.ntab=x.dataset.ntab;S.askFor=null;save();renderNote();b.scrollTop=0;});
  bindAsk(b);
}

/* ================== 이벤트 ================== */
function bindAsk(root){
  root.querySelectorAll("[data-ask]").forEach(x=>x.onclick=()=>{S.askFor=x.dataset.ask;render();});
  root.querySelectorAll("[data-askwho]").forEach(x=>x.onclick=()=>ask(x.dataset.askid,x.dataset.askwho));
  root.querySelectorAll("[data-askcancel]").forEach(x=>x.onclick=()=>{S.askFor=null;render();});
}
function bind(v){
  v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  v.querySelectorAll("[data-loc]").forEach(b=>b.onclick=()=>{S.loc=b.dataset.loc;S.sub=null;S.last=null;S.lockOpen=null;S.lockErr="";S.askFor=null;save();render();});
  v.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>doAct(b.dataset.act));
  v.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{S.lockOpen=b.dataset.lock;S.lockErr="";save();render();});
  v.querySelectorAll("[data-form]").forEach(f=>f.onsubmit=e=>{e.preventDefault();tryLock(f.dataset.form,f.querySelector("input").value)});
  v.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{const k=b.dataset.key;S.unl.push(k);S.lockOpen=null;const op=A.find(a=>a.lock===k&&a.open);if(op){S.sub=op.open;S.last=null;}save();render();});
  v.querySelectorAll("[data-close]").forEach(x=>x.onclick=()=>{S.pop=false;S.askFor=null;save();render();});
  v.querySelectorAll("[data-popov]").forEach(x=>x.onclick=e=>{if(e.target===x){S.pop=false;S.askFor=null;save();render();}});
  v.querySelectorAll("[data-pattern]").forEach(bindPattern);
  v.querySelectorAll("[data-go2]").forEach(x=>x.onclick=()=>{S.loc="base";S.sub=null;go("inv2");});
  v.querySelectorAll("[data-lockclose]").forEach(x=>x.onclick=()=>{S.lockOpen=null;S.lockErr="";save();render();});
  v.querySelectorAll("[data-lockov]").forEach(x=>x.onclick=e=>{if(e.target===x){S.lockOpen=null;S.lockErr="";save();render();}});
  v.querySelectorAll("[data-r2ok]").forEach(x=>x.onclick=()=>{S.r2seen=true;save();render();});
  v.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{const t=b.dataset.back;S.sub=SUBS[t]?t:null;S.last=null;S.lockOpen=null;S.askFor=null;save();render();});
  v.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.pick=b.dataset.pick;S.defShown=false;S.flash="";save();render();});
  v.querySelectorAll("[data-accuse]").forEach(b=>b.onclick=()=>{S.defShown=true;save();render();});
  v.querySelectorAll("[data-repick]").forEach(b=>b.onclick=()=>{S.pick=null;S.defShown=false;save();render();window.scrollTo(0,0);});
  v.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>{S.finalAsk=false;confirmAcc(S.phase==="acc1"?1:2);});
  v.querySelectorAll("[data-preacc]").forEach(b=>b.onclick=()=>{S.preAcc=true;render();});
  v.querySelectorAll("[data-prenb]").forEach(b=>b.onclick=()=>{S.preAcc=false;S.nb=true;S.ntab="alibi";render();});
  v.querySelectorAll("[data-preov]").forEach(x=>x.onclick=e=>{if(e.target===x){S.preAcc=false;render();}});
  v.querySelectorAll("[data-askfinal]").forEach(b=>b.onclick=()=>{S.finalAsk=true;render();});
  v.querySelectorAll("[data-finalno]").forEach(b=>b.onclick=()=>{S.finalAsk=false;render();});
  v.querySelectorAll("[data-finalov]").forEach(x=>x.onclick=e=>{if(e.target===x){S.finalAsk=false;render();}});
  v.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>{S.chPick=b.dataset.ev;save();render();});
  v.querySelectorAll("[data-present]").forEach(b=>b.onclick=()=>present(S.chPick));
  v.querySelectorAll("[data-fzend]").forEach(b=>b.onclick=()=>{S.ending=S.accused==="sungmin"?"standin":"wrong";S.endWho=S.accused;go("end");});
  v.querySelectorAll("[data-noev]").forEach(b=>b.onclick=()=>present(null));
  v.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{S=fresh();save();render();window.scrollTo(0,0);});
  v.querySelectorAll("[data-truth]").forEach(b=>b.onclick=()=>{S.showTruth=true;go("truth");});
  v.querySelectorAll("[data-toend]").forEach(b=>b.onclick=()=>go("end"));
  v.querySelectorAll("[data-reacc]").forEach(b=>b.onclick=()=>{S.ending=null;S.accused=null;S.showTruth=false;go("acc2");});
  v.querySelectorAll("[data-cf]").forEach(x=>x.onclick=()=>{S.cf=true;save();render();});
  v.querySelectorAll("[data-cfclose]").forEach(x=>x.onclick=()=>{S.cf=false;const first=!S.cfSeen;S.cfSeen=true;save();render();if(first)window.scrollTo(0,document.body.scrollHeight);});
  v.querySelectorAll("[data-opennb]").forEach(b=>b.onclick=()=>{S.nb=true;renderNote();});
  bindAsk(v);
}
$("nbbtn").onclick=()=>{S.nb=true;S.askFor=null;renderNote();};
$("nbclose").onclick=()=>{S.nb=false;S.askFor=null;renderNote();};
$("overlay").onclick=e=>{if(e.target.id==="overlay"){S.nb=false;renderNote();}};
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(S.nb){S.nb=false;renderNote();}else if(S.lockOpen){S.lockOpen=null;render();}else if(S.pop){S.pop=false;render();}});
render();
</script>

</body>
</html>
